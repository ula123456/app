<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tashkent Courier</title>
<style>
:root{
  --panel:rgba(18,22,30,.86); --panel2:rgba(30,36,48,.95); --text:#f3f5f8; --muted:#a9b3c2;
  --accent:#ffc83d; --good:#3ddc84; --bad:#ff5c5c; --blue:#4da3ff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1f27;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.panel{background:var(--panel);border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.35);backdrop-filter:blur(4px)}
#stats{position:fixed;left:10px;top:10px;padding:8px 12px;display:flex;gap:14px;flex-wrap:wrap;font-weight:700;font-size:15px;max-width:calc(100vw - 230px)}
#stats span{white-space:nowrap}
#order{position:fixed;left:50%;top:10px;transform:translateX(-50%);width:min(440px,calc(100vw - 20px));padding:10px 14px;font-size:14px;line-height:1.35;display:none}
#order.late{outline:2px solid var(--bad)}
#order .row{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:6px}
#order .big{font-size:17px;font-weight:800}
#order .en{color:var(--accent);font-weight:800;letter-spacing:.5px}
#order .bar{height:6px;background:#39404e;border-radius:4px;overflow:hidden;flex:1}
#order .bar i{display:block;height:100%;background:var(--good);width:100%}
#order.late .bar i{background:var(--bad)}
button{font:inherit;border:0;border-radius:9px;padding:7px 12px;cursor:pointer;background:#3a4354;color:var(--text);font-weight:700}
button:hover{filter:brightness(1.15)}
button.primary{background:var(--accent);color:#222}
button.good{background:var(--good);color:#06301a}
button.small{padding:4px 9px;font-size:13px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:150px;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(460px,92vw)}
.toast{background:var(--panel2);padding:8px 14px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 3px 12px rgba(0,0,0,.4);animation:tin .25s ease-out;text-align:center}
.toast.good{border-left:4px solid var(--good)} .toast.bad{border-left:4px solid var(--bad)} .toast.info{border-left:4px solid var(--blue)}
.toast b{color:var(--accent)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
#mini{position:fixed;right:10px;top:10px;width:200px;height:160px;border-radius:12px;cursor:pointer;border:2px solid rgba(255,255,255,.15)}
#btns{position:fixed;right:10px;top:178px;display:flex;flex-direction:column;gap:6px;width:200px}
#btns button{background:var(--panel);text-align:left}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);display:none;pointer-events:none}
#joy i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.45)}
#modalWrap{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:12px;z-index:10}
#modal{background:#202633;border-radius:16px;max-width:760px;width:100%;max-height:calc(100vh - 24px);overflow:auto;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text}
#modal h2{margin:0 0 8px;font-size:22px} #modal h3{margin:14px 0 6px;font-size:16px;color:var(--accent)}
#modal p{margin:6px 0;line-height:1.45;color:#d9dee7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{background:#2a3242;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card .em{font-size:34px}
.card .en{font-weight:800;color:var(--accent);font-size:17px}
.muted{color:var(--muted);font-size:13px}
.opts{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.opts button{font-size:18px;padding:12px 18px;flex:1;min-width:120px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.word{background:#2a3242;border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.word b{color:var(--accent)}
.lock{opacity:.35}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.seg label{background:#2a3242;padding:8px 12px;border-radius:9px;cursor:pointer;flex:1;min-width:200px}
.seg input{margin-right:6px}
#bigmap{width:100%;border-radius:10px;background:#111;display:block}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 12px;font-size:13px;margin-top:8px}
.legend div{display:flex;gap:6px;align-items:baseline}
.num{display:inline-block;min-width:20px;height:20px;border-radius:50%;background:#e63946;color:#fff;text-align:center;font-weight:800;font-size:12px;line-height:20px}
kbd{background:#394254;border-radius:4px;padding:1px 6px;font-size:12px}
@media (max-width:700px){
  #mini{width:130px;height:104px}
  #btns{top:120px;width:130px} #btns button{font-size:12px;padding:6px 8px}
  #stats{font-size:13px;gap:8px;max-width:calc(100vw - 150px);padding:6px 9px}
  #order{top:auto;bottom:10px;font-size:13px}
  #toasts{top:52px;left:10px;transform:none;width:calc(100vw - 160px);align-items:flex-start}
  .toast{font-size:12px;padding:6px 10px;text-align:left}
}
</style>
</head>

<canvas id="mini" title="Карта (M)"></canvas>
<div id="btns">
  <button id="bMap">🗺 Карта <kbd>M</kbd></button>
  <button id="bShop">🛒 Экипировка <kbd>B</kbd></button>
  <button id="bDict">📖 Словарь <kbd>N</kbd></button>
  <button id="bHelp">❓ Помощь <kbd>H</kbd></button>
  <button id="bVoice">🔊 Голос: вкл</button>
</div>
<div id="joy"><i></i></div>
<div id="modalWrap"><div id="modal"></div></div>

const T = 32;                      // размер тайла в пикселях
const NV = 10, NH = 8;             // число вертикальных / горизонтальных дорог
const BCX = 9, BCY = 7;            // число кварталов по X / Y
const rx = k => 4 + 12 * k, ry = k => 4 + 12 * k;  // левая/верхняя клетка дороги
const bt = b => 7 + 12 * b;        // начало квартала (в тайлах)
const W = rx(NV - 1) + 3 + 4, H = ry(NH - 1) + 3 + 4;
const WPX = W * T, HPX = H * T;
const cxR = k => (rx(k) + 1.5) * T, cyR = r => (ry(r) + 1.5) * T; // центры дорог
const G = 0, ROAD = 1, SIDE = 2, BLD = 3, PARK = 4, WATER = 5, PLAZA = 6, TREE = 7;
const grid = new Uint8Array(W * H);
const getT = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? TREE : grid[y * W + x];
const setT = (x, y, v) => { if (x >= 0 && y >= 0 && x < W && y < H) grid[y * W + x] = v; };
const fillT = (x, y, w, h, v) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) setT(i, j, v); };
const isSolid = t => t === BLD || t === WATER || t === TREE;
const CANAL_BX = 3, CANAL_X = bt(CANAL_BX) + 1; // канал Анхор

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rnd = mulberry32(998877);            // фиксированный сид — город всегда одинаковый
const pickR = arr => arr[Math.floor(rnd() * arr.length)];
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const round500 = v => Math.max(0, Math.round(v / 500) * 500);

const QO = [[1,1],[5,1],[1,5],[5,5]];             // кварталы делятся на 4 здания
const QSIDES = [['N','W'],['N','E'],['S','W'],['S','E']];
const ROOFS = ['#d9cbb0','#e6dfcf','#cfc6b4','#c7b79a','#d7c2a3','#b9c3cc','#c9b2a0','#e2d6bd','#a9b4bd','#d3c4ae','#bfae94'];
const blocks = [];
const lmAt = {}; LANDMARKS.forEach(l => lmAt[l.bx + ',' + l.by] = l);

function makeBuilding(b, lx, ly, w, h){
  const bl = {X:(b.x0+lx)*T, Y:(b.y0+ly)*T, w:w*T, h:h*T, roof:pickR(ROOFS), det:[], hgt:4+Math.floor(rnd()*6)};
  const n = 1 + Math.floor(rnd()*4);
  for (let i=0;i<n;i++) bl.det.push({x:10+rnd()*(bl.w-34), y:10+rnd()*(bl.h-34), s:8+rnd()*8, t:rnd()<.3?'tank':'ac'});
  return bl;
}

function buildRegular(b){
  const kinds = QO.map(() => rnd() < 0.12 ? 'park' : 'bld');
  b.kinds = kinds;
  const used = [false,false,false,false];
  const addB = (lx,ly,w,h) => { fillT(b.x0+lx,b.y0+ly,w,h,BLD); b.buildings.push(makeBuilding(b,lx,ly,w,h)); };
  const m = pickR(['none','none','top','bottom','left','right','tb']);
  const pairs = {top:[[0,1,1,1,7,3]],bottom:[[2,3,1,5,7,3]],left:[[0,2,1,1,3,7]],right:[[1,3,5,1,3,7]],tb:[[0,1,1,1,7,3],[2,3,1,5,7,3]]};
  (pairs[m]||[]).forEach(([a,c,lx,ly,w,h]) => { if (kinds[a]==='bld'&&kinds[c]==='bld'){ addB(lx,ly,w,h); used[a]=used[c]=true; } });
  QO.forEach(([lx,ly],q) => {
    if (kinds[q]==='park'){ fillT(b.x0+lx,b.y0+ly,3,3,PARK); b.parks.push({X:(b.x0+lx)*T,Y:(b.y0+ly)*T});
      for (let i=0;i<3;i++) b.trees.push({x:(b.x0+lx)*T+16+rnd()*64, y:(b.y0+ly)*T+16+rnd()*64, r:10+rnd()*5});
    } else if (!used[q]) addB(lx,ly,3,3);
  });
  if (rnd()<.5) b.trees.push({x:(b.x0+4.5)*T, y:(b.y0+4.5)*T, r:11});
}

function buildLandmark(b, lm){
  const f = (lx,ly,w,h,v) => fillT(b.x0+lx,b.y0+ly,w,h,v);
  switch (lm.key){
    case 'amir': f(1,1,7,7,PARK); f(4,4,1,1,BLD); break;
    case 'hotel': f(2,1,5,5,BLD); break;
    case 'navoi': f(2,1,5,4,BLD); f(4,6,1,1,WATER); break;
    case 'indep': f(1,1,7,7,PARK); f(4,4,1,1,BLD); break;
    case 'chorsu': f(2,2,5,5,BLD); break;
    case 'kukeldash': f(2,2,5,4,BLD); break;
    case 'hastimam': f(1,2,3,4,BLD); f(5,2,3,4,BLD); break;
    case 'tcity': f(1,1,7,7,PARK); f(2,3,4,3,WATER); f(6,1,2,2,BLD); break;
    case 'humo': f(2,2,5,4,BLD); break;
    case 'magic': f(1,1,7,7,PARK); f(3,2,3,3,BLD); break;
    case 'milliy': f(1,1,7,6,BLD); break;
    case 'tvtower': f(1,1,7,7,PARK); f(4,4,1,1,BLD); break;
    case 'japan': f(1,1,7,7,PARK); f(2,2,3,2,WATER); f(5,4,2,2,BLD); break;
    case 'zoo': f(1,1,7,7,PARK); f(1,1,3,3,BLD); f(5,1,3,3,BLD); break;
    case 'station': f(1,1,7,4,BLD); break;
    case 'broadway': break;
    case 'temurmuseum': f(2,2,5,5,BLD); break;
    case 'minor': f(3,1,5,7,PARK); f(4,2,3,4,BLD); break;
  }
}

function genCity(){
  fillT(0,0,W,H,G);
  // деревья по краям карты
  fillT(0,0,W,2,TREE); fillT(0,H-2,W,2,TREE); fillT(0,0,2,H,TREE); fillT(W-2,0,2,H,TREE);
  // канал Анхор течёт за пределы города
  fillT(CANAL_X,0,2,ry(0),WATER); fillT(CANAL_X,ry(NH-1)+3,2,H-ry(NH-1)-3,WATER);
  for (let k=0;k<NV;k++) fillT(rx(k),ry(0),3,ry(NH-1)+3-ry(0),ROAD);
  for (let r=0;r<NH;r++) fillT(rx(0),ry(r),rx(NV-1)+3-rx(0),3,ROAD);
  for (let by=0;by<BCY;by++) for (let bx=0;bx<BCX;bx++){
    const x0=bt(bx), y0=bt(by);
    const b = {bx,by,x0,y0,X:x0*T,Y:y0*T,type:'reg',buildings:[],parks:[],trees:[],kinds:null,lm:null};
    fillT(x0,y0,9,9,SIDE); fillT(x0+1,y0+1,7,7,PLAZA);
    const lm = lmAt[bx+','+by];
    if (bx===CANAL_BX){ b.type='canal'; fillT(x0+1,y0+1,2,7,WATER);
      if (!lm){ fillT(x0+3,y0+1,5,7,PARK); for(let i=0;i<5;i++) b.trees.push({x:(x0+3.5)*T+rnd()*4*T,y:(y0+1.5)*T+rnd()*6*T,r:10+rnd()*5}); } }
    if (lm){ b.lm=lm; lm.block=b; if (bx!==CANAL_BX) b.type='lm'; buildLandmark(b,lm); }
    else if (bx!==CANAL_BX) buildRegular(b);
    blocks.push(b);
  }
}

function signGeom(b,q,side){
  const [qx,qy] = QO[q]; const X=(b.x0+qx)*T, Y=(b.y0+qy)*T, S=3*T;
  let zone, board, awn;
  if (side==='N'){ zone={x:X,y:b.Y,w:S,h:T}; board={x:X+4,y:Y+4,w:S-8,h:34}; awn={x:X+6,y:Y-6,w:S-12,h:10,v:0}; }
  if (side==='S'){ zone={x:X,y:b.Y+8*T,w:S,h:T}; board={x:X+4,y:Y+S-38,w:S-8,h:34}; awn={x:X+6,y:Y+S-4,w:S-12,h:10,v:0}; }
  if (side==='W'){ zone={x:b.X,y:Y,w:T,h:S}; board={x:X+4,y:Y+31,w:S-8,h:34}; awn={x:X-6,y:Y+6,w:10,h:S-12,v:1}; }
  if (side==='E'){ zone={x:b.X+8*T,y:Y,w:T,h:S}; board={x:X+4,y:Y+31,w:S-8,h:34}; awn={x:X+S-4,y:Y+6,w:10,h:S-12,v:1}; }
  return {zone,board,awn,cx:zone.x+zone.w/2,cy:zone.y+zone.h/2};
}
(function placeSigns(){

})();

const P = {x:(bt(5)+4.5)*T, y:(bt(3)+8.5)*T, vx:0, vy:0, ang:-Math.PI/2, stun:0, walk:0, hitCd:0};
const vehSpeed = () => S.vehicle==='foot' ? FOOT_SPEED : (GEAR.find(g=>g.id===S.vehicle)||{speed:FOOT_SPEED}).speed;

const DX=[1,0,-1,0], DY=[0,1,0,-1], DANG=[0,Math.PI/2,Math.PI,-Math.PI/2];
const LANE = 24;
const cars = [];
const CAR_COLORS = ['#f5f5f5','#f5f5f5','#ececec','#c0c4c8','#9aa0a6','#1f1f1f','#2c3e50','#7b1e1e','#e1e1e1','#ffffff','#3c6382','#b8b8b8'];
function laneFor(dir,idx){ return dir===0? cyR(idx)+LANE : dir===2? cyR(idx)-LANE : dir===1? cxR(idx)-LANE : cxR(idx)+LANE; }
function spawnCar(i){
  const bus = i%9===0, horiz = Math.random()<.5;
  const c = {len:bus?72:40,wid:bus?24:20,color:bus?pick(['#2e86de','#10ac84','#ee5253']):pick(CAR_COLORS),bus,taxi:!bus&&Math.random()<.2,
    max:bus?85:95+Math.random()*60,spd:0,last:null,hcd:0};
  if (horiz){ c.r=Math.floor(Math.random()*NH); c.dir=Math.random()<.5?0:2; c.x=cxR(0)+Math.random()*(cxR(NV-1)-cxR(0)); c.y=laneFor(c.dir,c.r); }
  else { c.k=Math.floor(Math.random()*NV); c.dir=Math.random()<.5?1:3; c.y=cyR(0)+Math.random()*(cyR(NH-1)-cyR(0)); c.x=laneFor(c.dir,c.k); }
  c.ang = DANG[c.dir];
  return c;
}
for (let i=0;i<52;i++) cars.push(spawnCar(i));

function carDecide(c,k,r){
  const horiz = c.dir===0||c.dir===2, opts=[];
  const straightOk = c.dir===0? k<NV-1 : c.dir===2? k>0 : c.dir===1? r<NH-1 : r>0;
  if (straightOk) opts.push(c.dir,c.dir,c.dir);
  if (horiz){ if(r>0) opts.push(3); if(r<NH-1) opts.push(1); }
  else { if(k<NV-1) opts.push(0); if(k>0) opts.push(2); }
  const nd = pick(opts);
  if (nd!==c.dir){ c.dir=nd; if(nd===0||nd===2){ c.r=r; } else { c.k=k; } c.spd*=.6; }
  c.last = k+','+r;
}
function updateCars(dt){
  for (const c of cars){
    const horiz = c.dir===0||c.dir===2;
    let target = c.max;
    // впереди машина?
    for (const o of cars){ if (o===c||o.dir!==c.dir) continue;
      const d = horiz? (o.x-c.x)*DX[c.dir] : (o.y-c.y)*DY[c.dir];
      const lat = horiz? Math.abs(o.y-c.y) : Math.abs(o.x-c.x);
      if (d>0 && d<c.len/2+o.len/2+16 && lat<18){ target=0; break; } }
    // впереди игрок? — тормозим и сигналим
    const pd = horiz? (P.x-c.x)*DX[c.dir] : (P.y-c.y)*DY[c.dir];
    const pl = horiz? Math.abs(P.y-c.y) : Math.abs(P.x-c.x);
    if (pd>0 && pd<c.len/2+55 && pl<c.wid/2+14){ target=Math.min(target, pd<c.len/2+22?0:30);
      c.hcd-=dt; if (c.hcd<=0 && Math.hypot(P.x-c.x,P.y-c.y)<300){ sfx.honk(); c.hcd=2.5; } }
    c.spd += clamp(target-c.spd, -400*dt, 120*dt);
    const px=c.x, py=c.y;
    c.x += DX[c.dir]*c.spd*dt; c.y += DY[c.dir]*c.spd*dt;
    // плавное перестроение в свою полосу
    if (horiz){ const ty=laneFor(c.dir,c.r); c.y += clamp(ty-c.y,-80*dt,80*dt); }
    else { const tx=laneFor(c.dir,c.k); c.x += clamp(tx-c.x,-80*dt,80*dt); }
    // перекрёстки
    if (horiz){ for (let k=0;k<NV;k++){ const X=cxR(k); if ((px-X)*(c.x-X)<=0 && px!==c.x && c.last!==k+','+c.r){ carDecide(c,k,c.r); break; } } }
    else { for (let r=0;r<NH;r++){ const Y=cyR(r); if ((py-Y)*(c.y-Y)<=0 && py!==c.y && c.last!==c.k+','+r){ carDecide(c,c.k,r); break; } } }
    let da = DANG[c.dir]-c.ang; while(da>Math.PI) da-=2*Math.PI; while(da<-Math.PI) da+=2*Math.PI;
    c.ang += clamp(da,-6*dt,6*dt);
    // столкновение с игроком
    const ca=Math.cos(c.ang), sa=Math.sin(c.ang), lx=(P.x-c.x)*ca+(P.y-c.y)*sa, ly=-(P.x-c.x)*sa+(P.y-c.y)*ca, pr=9;
    if (Math.abs(lx)<c.len/2+pr && Math.abs(ly)<c.wid/2+pr) hitByCar(c,lx,ly,ca,sa);
  }
}
function hitByCar(c,lx,ly,ca,sa){
  // выталкиваем игрока
  const ox=c.len/2+10-Math.abs(lx), oy=c.wid/2+10-Math.abs(ly);
  let nx,ny; if (ox<oy){ const s=Math.sign(lx)||1; nx=ca*s; ny=sa*s; } else { const s=Math.sign(ly)||1; nx=-sa*s; ny=ca*s; }
  const push=Math.min(ox,oy)+1;
  if (canStand(P.x+nx*push,P.y+ny*push)){ P.x+=nx*push; P.y+=ny*push; }
  if (P.hitCd<=0){
    P.hitCd=2; P.stun=.8; P.vx=nx*180; P.vy=ny*180; sfx.bad();
    const fine = Math.min(S.money, 2000);
    S.money -= fine; save();
    toast(`💥 <b>Be careful!</b> — Осторожно! ${fine?'Штраф '+fmt(fine):''}`,'bad'); say('Be careful!');
  }
}

  if(seg===0) return [x0+f*L,y0]; if(seg===1) return [x0+L,y0+f*L]; if(seg===2) return [x0+L-f*L,y0+L]; return [x0,y0+L-f*L]; }

// ---------- Движение игрока ----------
function canStand(x,y,r=9){
  for (const [dx,dy] of [[-r,-r],[r,-r],[-r,r],[r,r],[0,-r],[0,r],[-r,0],[r,0]])
    if (isSolid(getT(Math.floor((x+dx)/T),Math.floor((y+dy)/T)))) return false;
  return true;
}
const keys = {};
const joy = {active:false,id:null,ox:0,oy:0,dx:0,dy:0};
function updatePlayer(dt){
  let ix=0, iy=0;
  if (keys.ArrowLeft||keys.KeyA) ix-=1; if (keys.ArrowRight||keys.KeyD) ix+=1;
  if (keys.ArrowUp||keys.KeyW) iy-=1; if (keys.ArrowDown||keys.KeyS) iy+=1;
  if (joy.active){ ix=joy.dx; iy=joy.dy; }
  const m = Math.hypot(ix,iy); if (m>1){ ix/=m; iy/=m; }
  P.hitCd -= dt;
  const sp = vehSpeed();
  const acc = S.vehicle==='foot'?14:S.vehicle==='moto'?3.5:5;
  if (P.stun>0){ P.stun-=dt; ix=iy=0; }
  P.vx += (ix*sp-P.vx)*Math.min(1,acc*dt); P.vy += (iy*sp-P.vy)*Math.min(1,acc*dt);
  const nx=P.x+P.vx*dt, ny=P.y+P.vy*dt;
  if (canStand(nx,P.y)) P.x=nx; else P.vx*=.2;
  if (canStand(P.x,ny)) P.y=ny; else P.vy*=.2;
  P.x = clamp(P.x, rx(0)*T+10, (rx(NV-1)+3)*T-10); P.y = clamp(P.y, ry(0)*T+10, (ry(NH-1)+3)*T-10);
  const v=Math.hypot(P.vx,P.vy);
  if (v>15){ const ta=Math.atan2(P.vy,P.vx); let da=ta-P.ang; while(da>Math.PI)da-=2*Math.PI; while(da<-Math.PI)da+=2*Math.PI; P.ang+=da*Math.min(1,12*dt); P.walk+=v*dt*.08; }
}

const man = (a,b) => Math.abs(a.cx-b.cx)+Math.abs(a.cy-b.cy);
function newOrder(){

  // предпочитаем товары с ещё не выученными словами
  const pool = [];
  shopsS.forEach(s => s.ref.items.forEach(it => { const w = S.words[it.en.toLowerCase()] ? 1 : 3; for(let i=0;i<w;i++) pool.push([s,it]); }));
  const me = {cx:P.x,cy:P.y};
  let s, it, tries=0;
  do { [s,it] = pick(pool); tries++; } while (S.delivered<4 && man(me,s)>2600 && tries<40);
  let dests = DESTS.filter(d => { const m=man(s,d); return m>700 && m<(S.delivered<4?2400:3800); });
  if (!dests.length) dests = DESTS;
  const d = pick(dests);
  const dist = man(me,s)+man(s,d);
  const total = Math.round(dist/FOOT_SPEED*1.35 + 40 + (has('bag')?15:0) + (S.delivered<3?30:0));
  order = {sign:s, shop:s.ref, item:it, dest:d, phase:'pickup', time:total, total, hint:S.diff==='easy'?1:0, hintCost:0, base:round500(9000+dist*3.2)};
  toast(`📱 Новый заказ: <b>${it.e} ${it.ru}</b>`,'info'); sfx.ping();
  renderOrder();
}
function useHint(){
  if (!order || order.phase!=='pickup' || order.hint>=2) return;
  order.hint++; order.hintCost += order.hint===1?2000:3000;
  if (order.hint===1){ toast(`💡 Ищи вывеску <b>${order.shop.type}</b> (${order.shop.ru})`,'info'); say(order.shop.type.toLowerCase()); }
  else toast('🧭 Стрелка покажет дорогу к магазину','info');
  renderOrder();
}
function skipOrder(){ if(!order) return; order=null; toast('Заказ отменён. Новый заказ через пару секунд…','info'); nextOrderIn=2; renderOrder(); }

function inZone(z,m=6){ return P.x>z.x-m && P.x<z.x+z.w+m && P.y>z.y-m && P.y<z.y+z.h+m; }
function checkZones(){
  let found=null; for (const s of SIGNS) if (inZone(s.zone)){ found=s; break; }
  if (found!==lastSign){ lastSign=found; if (found) enterSign(found); }
  if (order && order.phase==='deliver'){
    const inside = inZone(order.dest.zone,8);
    if (inside && lastDest!==order.dest) { lastDest=order.dest; deliver(); }
    if (!inside) lastDest=null;
  }
}
function enterSign(s){
  const isNew = !S.disc.includes(s.id);
  if (isNew){ S.disc.push(s.id); save(); }
  if (s.kind==='shop'){
    learn(s.ref.type, s.ref.ru, 'sign');
    if (order && order.phase==='pickup'){
      if (s.id===order.shop.id){ pickup(); return; }
      toast(`❌ Это <b>${s.ref.type}</b> — ${s.ref.ru}. Здесь нет «${order.item.ru}».`,'bad'); sfx.bad(); say(s.ref.type.toLowerCase());
      return;
    }
    toast(`🏪 <b>${s.ref.brand} — ${s.ref.type}</b> = ${s.ref.ru}`,'info'); say(s.ref.type.toLowerCase());
  } else {
    learn(s.ref.en, s.ref.ru, 'place');
    if (!(order && order.phase==='deliver' && order.dest.sign===s)){ toast(`${s.ref.icon} <b>${s.ref.en}</b> = ${s.ref.ru}`,'info'); say(s.ref.en.toLowerCase()); }
  }
  if (isNew) toast('🗺 Новое место отмечено на карте','good');
}
function pickup(){
  order.phase='deliver'; sfx.ok();
  learn(order.item.en, order.item.ru, 'item');
  toast(`✅ <b>Here is your ${order.item.en}!</b> — Держи: ${order.item.ru} ${order.item.e}`,'good');
  say('Here is your '+order.item.en+'!');
  renderOrder();
}
function deliver(){
  const o=order, late=o.time<0;
  const others = ALLWORDS.filter(w=>w.cat==='item' && w.en!==o.item.en);
  const opts=[o.item.en]; while(opts.length<3){ const w=pick(others).en; if(!opts.includes(w)) opts.push(w); }
  opts.sort(()=>Math.random()-.5);
  say('Thank you! What did you bring?');
  openModal(`<h2>🙂 Customer: “Thank you! What did you bring?”</h2>
    <p>Клиент спрашивает: <b>«Спасибо! Что ты принёс?»</b> Выбери английское слово — за правильный ответ получишь чаевые (tip).</p>
    <p style="font-size:40px;text-align:center;margin:8px 0">${o.item.e}</p>
    <div class="opts">${opts.map(w=>`<button data-w="${w}">${w}</button>`).join('')}</div>
    <div id="quizRes"></div>`, {noClose:true});
  document.querySelectorAll('#modal .opts button').forEach(btn => btn.onclick = () => {
    const ok = btn.dataset.w===o.item.en;
    document.querySelectorAll('#modal .opts button').forEach(b=>{ b.disabled=true; if(b.dataset.w===o.item.en) b.className='good'; });
    if (!ok) btn.style.background='var(--bad)';
    ok ? (sfx.ok(), say('Yes! '+o.item.en+'. Thank you!')) : (sfx.bad(), say('No, it is '+o.item.en));
    finishDelivery(o, late, ok);
  });
}
function finishDelivery(o, late, quizOk){
  let pay = o.base * (late?.4:1) * (has('jacket')?1.15:1);
  const tip = quizOk ? round500(o.base*.2*(has('cap')?1.25:1)) : 0;
  pay = Math.max(1000, round500(pay) + tip - o.hintCost);
  S.money += pay; S.earned += pay; S.delivered++; if(!late) S.onTime++; save();
  setTimeout(sfx.coin, 250);
  const d=o.dest;
  document.getElementById('quizRes').innerHTML = `
    <h3>${late?'⏰ Доставлено с опозданием':'🚀 Доставлено вовремя!'}</h3>
    <p>Оплата: <b>${fmt(round500(o.base*(late?.4:1)*(has('jacket')?1.15:1)))}</b>${has('jacket')?' (куртка +15%)':''}
      ${tip?`<br>Чаевые (tip): <b>${fmt(tip)}</b>${has('cap')?' (кепка +25%)':''}`:''}
      ${o.hintCost?`<br>Подсказки: −${fmt(o.hintCost)}`:''}
      <br><span style="font-size:22px;color:var(--good);font-weight:800">+${fmt(pay)}</span> → в кошелёк 👛</p>
    ${d.kind==='landmark'?`<p>📍 <b>${d.en}</b> — ${d.ru}.<br><span class="muted">${d.lm.fact}</span></p>`:`<p>📍 <b>${d.en}</b> = ${d.ru}</p>`}
    <p style="text-align:right"><button class="primary" id="nextBtn">Следующий заказ ▶</button></p>`;
  if (d.kind==='public') learn(d.en,d.ru,'place');
  document.getElementById('nextBtn').onclick = () => { closeModal(); nextOrderIn=1.2; };
  order=null; renderOrder(); renderStats();
}

function renderOrder(){

    ${late?'<div class="muted" style="color:#ff9b9b">⏰ Опаздываешь! Оплата будет меньше (40%).</div>':''}`;

let wasLate=false;
function updateTimer(){
  if (!order) return;
  const late = order.time<0;

  const t=$('otime'), b=$('obar'); if(t) t.textContent = late?'опоздание':mmss(order.time);

const TCOL = {[G]:'#86b865',[ROAD]:'#4a4d55',[SIDE]:'#c9c3b5',[BLD]:'#9a8f80',[PARK]:'#5fa34a',[WATER]:'#3d8fd1',[PLAZA]:'#d9d1c0',[TREE]:'#3b7330'};
const mapImg = document.createElement('canvas');
(function(){ const s=2; mapImg.width=W*s; mapImg.height=H*s; const m=mapImg.getContext('2d');
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){ m.fillStyle=TCOL[grid[y*W+x]]; m.fillRect(x*s,y*s,s,s); } })();
const mini=$('mini'), mctx=mini.getContext('2d');
function drawMini(){
  const w=mini.clientWidth, h=mini.clientHeight, dpr=Math.min(2,window.devicePixelRatio||1);
  if (mini.width!==w*dpr){ mini.width=w*dpr; mini.height=h*dpr; }
  mctx.setTransform(dpr,0,0,dpr,0,0);
  const sc=Math.min(w/WPX,h/HPX), ox=(w-WPX*sc)/2, oy=(h-HPX*sc)/2;
  mctx.fillStyle='#223'; mctx.fillRect(0,0,w,h);
  mctx.imageSmoothingEnabled=false; mctx.drawImage(mapImg,ox,oy,WPX*sc,HPX*sc);
  const dot=(x,y,r,c,s)=>{ mctx.fillStyle=c; mctx.beginPath(); mctx.arc(ox+x*sc,oy+y*sc,r,0,7); mctx.fill(); if(s){mctx.strokeStyle=s;mctx.lineWidth=1.5;mctx.stroke();} };
  LANDMARKS.forEach(l=>dot((l.block.x0+4.5)*T,(l.block.y0+4.5)*T,2.5,'#e63946'));
  S.disc.forEach(id=>{ const s=signById(id); if(s) dot(s.cx,s.cy,2,s.ref.color,'#fff'); });
  if (order){ const t=targetPoint(); if(t) dot(t.x,t.y,4+Math.sin(perfT*6),'#ffc83d','#000'); }
  dot(P.x,P.y,3.5,'#fff','#000');
}
function targetPoint(){
  if (!order) return null;
  if (order.phase==='deliver') return {x:order.dest.cx,y:order.dest.cy};
  if (order.hint>=2) return {x:order.sign.cx,y:order.sign.cy};
  return null;
}

    <canvas id="bigmap"></canvas><div class="legend" id="legend"></div>
    <p style="text-align:right"><button class="primary" id="cl">Закрыть</button></p>`);
  $('cl').onclick=closeModal;
  const cv=$('bigmap'), w=cv.clientWidth, h=Math.round(w*HPX/WPX), dpr=Math.min(2,window.devicePixelRatio||1);
  cv.style.height=h+'px'; cv.width=w*dpr; cv.height=h*dpr;
  const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.imageSmoothingEnabled=false;
  const sc=w/WPX; c.drawImage(mapImg,0,0,w,h);

  for (let r=1;r<NH;r+=2) c.fillText(STREETS_H[r], (cxR(6)+cxR(7))/2*sc, cyR(r)*sc);
  S.disc.forEach(id=>{ const s=signById(id); if(!s) return; c.fillStyle=s.ref.color; c.beginPath(); c.arc(s.cx*sc,s.cy*sc,4,0,7); c.fill(); c.strokeStyle='#fff'; c.lineWidth=1; c.stroke();
    if (w>500){ c.font='bold 8px system-ui'; c.fillStyle='#fff'; c.fillText(s.kind==='shop'?s.ref.type:s.ref.en, s.cx*sc, s.cy*sc-9); } });
  LANDMARKS.forEach((l,i)=>{ const x=(l.block.x0+4.5)*T*sc, y=(l.block.y0+4.5)*T*sc;
    c.fillStyle='#e63946'; c.beginPath(); c.arc(x,y,9,0,7); c.fill(); c.strokeStyle='#fff'; c.lineWidth=2; c.stroke();
    c.fillStyle='#fff'; c.font='bold 10px system-ui'; c.fillText(i+1,x,y+.5); });
  // канал
  c.fillStyle='#bfe3ff'; c.font='italic bold 9px system-ui'; c.save(); c.translate((CANAL_X+1)*T*sc+10,cyR(3)*sc+60); c.rotate(-Math.PI/2); c.fillText('Ankhor Canal',0,0); c.restore();
  const t=targetPoint(); if (t){ c.fillStyle='#ffc83d'; c.beginPath(); c.arc(t.x*sc,t.y*sc,7,0,7); c.fill(); c.strokeStyle='#000'; c.lineWidth=2; c.stroke(); }
  c.fillStyle='#fff'; c.beginPath(); c.arc(P.x*sc,P.y*sc,6,0,7); c.fill(); c.strokeStyle='#000'; c.lineWidth=2; c.stroke();
  $('legend').innerHTML = LANDMARKS.map((l,i)=>`<div><span class="num">${i+1}</span><span>${l.icon} <b>${l.en}</b><br><span class="muted">${l.ru}</span></span></div>`).join('');
}

// ---------- Отрисовка мира ----------
const cv=$('game'), ctx=cv.getContext('2d');
let dpr=1, VW=0, VH=0, zoom=1, camX=0, camY=0, perfT=0;
function resize(){ dpr=Math.min(2,window.devicePixelRatio||1); VW=innerWidth; VH=innerHeight; cv.width=VW*dpr; cv.height=VH*dpr;
  zoom = clamp(Math.min(VW,VH)/720, .75, 1.35) * zoomUser; }
let zoomUser=1;
addEventListener('resize', resize);

const R=(x,y,w,h,c)=>{ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); };
const C=(x,y,r,c)=>{ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); };
function RR(x,y,w,h,r,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,r) : ctx.rect(x,y,w,h); ctx.fill(); }
function tree(x,y,r=12,c='#2f7d32'){ C(x+4,y+5,r,'rgba(0,0,0,.22)'); C(x,y,r,c); C(x-r*.3,y-r*.3,r*.5,'rgba(255,255,255,.13)'); }
function txt(s,x,y,size,col,bold=true,align='center'){ ctx.font=`${bold?'800 ':''}${size}px system-ui,Arial`; ctx.fillStyle=col; ctx.textAlign=align; ctx.textBaseline='middle'; ctx.fillText(s,x,y); }
function fitText(s,x,y,maxW,size,col){ ctx.font=`800 ${size}px system-ui,Arial`; const w=ctx.measureText(s).width; if (w>maxW) size=Math.max(6,size*maxW/w); txt(s,x,y,size,col); }
const inView = (x,y,w,h) => x+w>camX-40 && y+h>camY-40 && x<camX+VW/zoom+40 && y<camY+VH/zoom+40;

function drawRoads(){
  const y0=ry(0)*T, y1=(ry(NH-1)+3)*T, x0=rx(0)*T, x1=(rx(NV-1)+3)*T;
  for (let k=0;k<NV;k++) R(rx(k)*T,y0,3*T,y1-y0,'#40434a');
  for (let r=0;r<NH;r++) R(x0,ry(r)*T,x1-x0,3*T,'#40434a');
  ctx.lineWidth=2;
  // разметка между перекрёстками
  for (let k=0;k<NV;k++) for (let r=0;r<NH-1;r++){
    const x=cxR(k), ya=(ry(r)+3)*T, yb=ry(r+1)*T; if(!inView(x-50,ya,100,yb-ya)) continue;
    ctx.strokeStyle='#e8d36a'; ctx.setLineDash([14,12]); ctx.beginPath(); ctx.moveTo(x,ya+18); ctx.lineTo(x,yb-18); ctx.stroke();
    ctx.setLineDash([]); ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.moveTo(x-44,ya+18); ctx.lineTo(x-44,yb-18); ctx.moveTo(x+44,ya+18); ctx.lineTo(x+44,yb-18); ctx.stroke();
    zebra(x-44,ya+2,88,14,true); zebra(x-44,yb-16,88,14,true);
    if ((k+r)%2===0){ ctx.save(); ctx.translate(x+22,(ya+yb)/2); ctx.rotate(Math.PI/2); txt(STREETS_V[k],0,0,11,'rgba(255,255,255,.35)'); ctx.restore(); }
  }
  for (let r=0;r<NH;r++) for (let k=0;k<NV-1;k++){
    const y=cyR(r), xa=(rx(k)+3)*T, xb=rx(k+1)*T; if(!inView(xa,y-50,xb-xa,100)) continue;
    ctx.strokeStyle='#e8d36a'; ctx.setLineDash([14,12]); ctx.beginPath(); ctx.moveTo(xa+18,y); ctx.lineTo(xb-18,y); ctx.stroke();
    ctx.setLineDash([]); ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.moveTo(xa+18,y-44); ctx.lineTo(xb-18,y-44); ctx.moveTo(xa+18,y+44); ctx.lineTo(xb-18,y+44); ctx.stroke();
    zebra(xa+2,y-44,14,88,false); zebra(xb-16,y-44,14,88,false);
    if ((k+r)%2===1) txt(STREETS_H[r],(xa+xb)/2,y-22,11,'rgba(255,255,255,.35)');
  }
  // мосты через Анхор
  const cxw=CANAL_X*T;
  for (let r=0;r<NH;r++){ const y=ry(r)*T; if(!inView(cxw,y,64,96)) continue;
    R(cxw-4,y-3,72,5,'#d6d0c4'); R(cxw-4,y+3*T-2,72,5,'#d6d0c4'); }
}
function zebra(x,y,w,h,horizStripes){
  ctx.fillStyle='rgba(255,255,255,.75)';
  if (horizStripes) for (let i=4;i<w-4;i+=12) ctx.fillRect(x+i,y,6,h);
  else for (let i=4;i<h-4;i+=12) ctx.fillRect(x,y+i,w,6);
}
function drawBuilding(bl){
  R(bl.X+bl.hgt,bl.Y+bl.hgt,bl.w,bl.h,'rgba(0,0,0,.28)');
  R(bl.X,bl.Y,bl.w,bl.h,shade(bl.roof,-28));
  R(bl.X+3,bl.Y+3,bl.w-6,bl.h-6,bl.roof);
  ctx.strokeStyle='rgba(0,0,0,.08)'; ctx.lineWidth=1; ctx.strokeRect(bl.X+8.5,bl.Y+8.5,bl.w-17,bl.h-17);
  for (const d of bl.det){
    if (d.t==='ac'){ R(bl.X+d.x+2,bl.Y+d.y+2,d.s,d.s*.8,'rgba(0,0,0,.2)'); R(bl.X+d.x,bl.Y+d.y,d.s,d.s*.8,'#b7bcc2'); C(bl.X+d.x+d.s/2,bl.Y+d.y+d.s*.4,d.s*.25,'#80868c'); }
    else { C(bl.X+d.x+d.s/2+2,bl.Y+d.y+d.s/2+2,d.s/2,'rgba(0,0,0,.2)'); C(bl.X+d.x+d.s/2,bl.Y+d.y+d.s/2,d.s/2,'#8fa3b0'); }
  }
}
function shade(hex,amt){ const n=parseInt(hex.slice(1),16); const r=clamp((n>>16)+amt,0,255), g=clamp((n>>8&255)+amt,0,255), b=clamp((n&255)+amt,0,255); return `rgb(${r},${g},${b})`; }

function drawBlockBase(b){
  R(b.X,b.Y,9*T,9*T,'#c9c3b5');
  ctx.strokeStyle='rgba(0,0,0,.07)'; ctx.lineWidth=1; ctx.beginPath();
  for (let i=1;i<9;i++){ ctx.moveTo(b.X+i*T,b.Y); ctx.lineTo(b.X+i*T,b.Y+T); ctx.moveTo(b.X+i*T,b.Y+8*T); ctx.lineTo(b.X+i*T,b.Y+9*T);
    ctx.moveTo(b.X,b.Y+i*T); ctx.lineTo(b.X+T,b.Y+i*T); ctx.moveTo(b.X+8*T,b.Y+i*T); ctx.lineTo(b.X+9*T,b.Y+i*T); }
  ctx.stroke();
  ctx.strokeStyle='#8f8a7e'; ctx.lineWidth=3; ctx.strokeRect(b.X+1.5,b.Y+1.5,9*T-3,9*T-3);
  R(b.X+T,b.Y+T,7*T,7*T,'#d9d1c0');
}
function drawRegular(b){
  for (const p of b.parks) R(p.X,p.Y,3*T,3*T,'#62a64d');
  for (const bl of b.buildings) drawBuilding(bl);
  for (const t of b.trees) tree(t.x,t.y,t.r);
}
function drawCanal(b){
  const X=b.X, Y=b.Y;
  R(X+T,Y+T,2*T,7*T,'#3d8fd1');
  ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=1.5;
  for (let i=0;i<6;i++){ const yy=Y+T+20+i*34+Math.sin(perfT*1.5+i)*4; ctx.beginPath(); ctx.moveTo(X+T+10,yy); ctx.quadraticCurveTo(X+2*T,yy-6,X+3*T-10,yy); ctx.stroke(); }
  R(X+T-3,Y+T,3,7*T,'#a39e92'); R(X+3*T,Y+T,3,7*T,'#a39e92');
  // мостики на тротуарах
  R(X+T,Y,2*T,T,'#bdb6a6'); R(X+T,Y+8*T,2*T,T,'#bdb6a6');
  R(X+T,Y+2,2*T,3,'#7d776c'); R(X+T,Y+T-5,2*T,3,'#7d776c'); R(X+T,Y+8*T+2,2*T,3,'#7d776c'); R(X+T,Y+9*T-5,2*T,3,'#7d776c');
  if (!b.lm){ R(X+3*T+3,Y+T,5*T-3,7*T,'#62a64d'); ctx.strokeStyle='#d9d1c0'; ctx.lineWidth=10; ctx.beginPath(); ctx.moveTo(X+3.5*T,Y+T); ctx.bezierCurveTo(X+6*T,Y+3*T,X+4*T,Y+6*T,X+7*T,Y+8*T); ctx.stroke();
    for (const t of b.trees) tree(t.x,t.y,t.r);
    if (b.by%2===0){ ctx.save(); ctx.translate(X+2*T,Y+4.5*T); ctx.rotate(-Math.PI/2); txt('Ankhor Canal · канал Анхор',0,0,10,'rgba(255,255,255,.8)'); ctx.restore(); } }
}

function drawLandmark(b){

  switch(k){

    ctx.strokeStyle='#bba783'; ctx.lineWidth=2; for(let i=1;i<10;i++){ ctx.beginPath(); ctx.moveTo(X+2*T+i*16,Y+T); ctx.lineTo(X+2*T+i*16,Y+6*T); ctx.stroke(); }
    R(X+2*T,Y+T,5*T,10,'#2f6fb3'); txt('HOTEL UZBEKISTAN',cx,Y+T+5,8,'#fff'); break; }
  case 'navoi':{ R(X+2*T+8,Y+T+8,5*T,4*T,'rgba(0,0,0,.3)'); R(X+2*T,Y+T,5*T,4*T,'#f1e6cf'); R(X+2.5*T,Y+1.5*T,4*T,3*T,'#e6d3ad');

    RR(X+1.3*T,Y+6*T,1.5*T,1.4*T,6,'#e07ba3'); RR(X+6.2*T,Y+6*T,1.5*T,1.4*T,6,'#e07ba3'); break; }
  case 'indep':{ park(); R(cx-14,Y+T,28,7*T,'#ddd2b6'); C(cx,cy,1.6*T,'#ddd2b6');

    R(X+1.3*T,Y+1.2*T,6*T+8,6,'#f0f0f0');

    ctx.strokeStyle='#d8f0ff'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.ellipse(cx,cy,13,5,0,0,7); ctx.stroke(); ctx.beginPath(); ctx.ellipse(cx,cy,5,13,0,0,7); ctx.stroke(); break; }
  case 'chorsu':{ for (let i=0;i<10;i++){ const a=i/10*Math.PI*2; const sx=cx+Math.cos(a)*3.1*T, sy=cy+Math.sin(a)*3.1*T;

    C(cx+10,cy+10,2.6*T,'rgba(0,0,0,.3)'); C(cx,cy,2.6*T,'#1f8a9c'); ctx.strokeStyle='#7fd3df'; ctx.lineWidth=2;
    for (let i=0;i<16;i++){ const a=i/16*Math.PI*2; ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*14,cy+Math.sin(a)*14); ctx.lineTo(cx+Math.cos(a)*2.6*T,cy+Math.sin(a)*2.6*T); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(cx,cy,1.8*T,0,7); ctx.stroke(); C(cx,cy,14,'#0f5f6c'); break; }
  case 'kukeldash':{ R(X+2*T+8,Y+2*T+8,5*T,4*T,'rgba(0,0,0,.3)'); R(X+2*T,Y+2*T,5*T,4*T,'#c8a26b'); R(X+3*T,Y+3*T,3*T,2*T,'#e0c592'); tree(cx,Y+4*T,12);

    tree(cx,Y+7*T,11); break; }
  case 'tcity':{ park(); RR(X+2*T,Y+3*T,4*T,3*T,30,'#3d8fd1');

    R(X+6*T+16,Y+T+16,2*T,2*T,'rgba(0,0,0,.35)'); R(X+6*T,Y+T,2*T,2*T,'#4f7da3'); R(X+6*T+6,Y+T+6,2*T-12,2*T-12,'#7fb0d6');
    ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=1; for(let i=1;i<5;i++){ ctx.beginPath(); ctx.moveTo(X+6*T+i*12.8,Y+T); ctx.lineTo(X+6*T+i*12.8,Y+3*T); ctx.stroke(); }
    tree(X+1.6*T,Y+1.6*T,12); tree(X+3.5*T,Y+1.7*T,12); tree(X+1.6*T,Y+7*T,12); tree(X+6.8*T,Y+6.8*T,12); tree(X+4.5*T,Y+7.1*T,11); break; }
  case 'humo':{ ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(cx+8,Y+4*T+8,2.6*T,2.05*T,0,0,7); ctx.fill();
    ctx.fillStyle='#1d3557'; ctx.beginPath(); ctx.ellipse(cx,Y+4*T,2.6*T,2.05*T,0,0,7); ctx.fill();
    ctx.strokeStyle='#4d8fc4'; ctx.lineWidth=3; for (let i=1;i<4;i++){ ctx.beginPath(); ctx.ellipse(cx,Y+4*T,2.6*T-i*12,2.05*T-i*10,0,0,7); ctx.stroke(); }
    txt('HUMO',cx,Y+4*T,14,'#a8dadc'); break; }
  case 'magic':{ park(); ctx.strokeStyle='#e8c07a'; ctx.lineWidth=12; ctx.beginPath(); ctx.arc(cx,Y+3.5*T,2.6*T,0,7); ctx.stroke();

  case 'milliy':{ RR(X+T+8,Y+T+8,7*T,6*T,40,'rgba(0,0,0,.3)'); RR(X+T,Y+T,7*T,6*T,40,'#cfd8dc'); RR(X+1.5*T,Y+1.5*T,6*T,5*T,30,'#90a4ae');

  case 'station':{ R(X+T+8,Y+T+8,7*T,4*T,'rgba(0,0,0,.3)'); R(X+T,Y+T,7*T,4*T,'#e9e3d0');
    for (let i=0;i<7;i++) R(X+T+6+i*T,Y+T+6,T-12,4*T-12,'#d5cbb0');
    R(cx-20,Y+T,40,4*T,'#b7a77a'); C(cx,Y+2.2*T,12,'#fff'); ctx.strokeStyle='#333'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(cx,Y+2.2*T); ctx.lineTo(cx,Y+2.2*T-8); ctx.moveTo(cx,Y+2.2*T); ctx.lineTo(cx+6,Y+2.2*T); ctx.stroke();
    ctx.strokeStyle='#7f7f7f'; ctx.lineWidth=2; for (let j=0;j<2;j++){ const yy=Y+6*T+j*28; ctx.beginPath(); ctx.moveTo(X+T,yy); ctx.lineTo(X+8*T,yy); ctx.moveTo(X+T,yy+10); ctx.lineTo(X+8*T,yy+10); ctx.stroke(); }
    txt('TOSHKENT',cx,Y+4.4*T,10,'#2c3e50'); break; }
  case 'broadway':{ R(X+T,Y+T,7*T,7*T,'#e2cfa8'); ctx.strokeStyle='rgba(0,0,0,.06)'; ctx.lineWidth=1;
    for (let i=0;i<14;i++){ ctx.beginPath(); ctx.moveTo(X+T+i*16,Y+T); ctx.lineTo(X+T+i*16,Y+8*T); ctx.stroke(); }
    for (let i=0;i<6;i++){ const yy=Y+1.6*T+i*1.05*T; C(X+1.8*T,yy,13,['#e74c3c','#f1c40f','#3498db','#9b59b6','#1abc9c','#e67e22'][i]); C(X+7.2*T,yy,13,['#1abc9c','#e67e22','#e74c3c','#f1c40f','#3498db','#9b59b6'][i]);
      R(X+2.6*T,yy-8,14,16,'#fff'); R(X+2.6*T+2,yy-6,10,12,['#f6b93b','#78e08f','#82ccdd','#e55039','#b71540','#4a69bd'][i]); }
    tree(cx,Y+2.5*T,11); tree(cx,Y+6.5*T,11); break; }
  case 'temurmuseum':{ R(X+T,Y+T,7*T,7*T,'#d9d1c0'); C(cx+10,cy+10,2.5*T,'rgba(0,0,0,.3)'); C(cx,cy,2.5*T,'#f5f5f0');
    for (let i=0;i<20;i++){ const a=i/20*Math.PI*2; C(cx+Math.cos(a)*2.3*T,cy+Math.sin(a)*2.3*T,3,'#c8c8c0'); }
    C(cx,cy,1.6*T,'#1e6fd9'); ctx.strokeStyle='#7fb3ff'; ctx.lineWidth=1.5; for(let i=0;i<12;i++){ const a=i/12*Math.PI*2; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*1.6*T,cy+Math.sin(a)*1.6*T); ctx.stroke(); }
    C(cx,cy,7,'#f1c40f'); break; }
  case 'minor':{ R(X+3*T+3,Y+T,5*T-3,7*T,'#62a64d'); R(X+3.5*T,Y+1.5*T,4*T,5*T,'#e8e4da');
    R(X+4*T+6,Y+2*T+6,3*T,4*T,'rgba(0,0,0,.3)'); R(X+4*T,Y+2*T,3*T,4*T,'#fbfbf8'); C(X+5.5*T,Y+4*T,1.1*T,'#3a8fd8'); C(X+5.5*T-6,Y+4*T-6,9,'rgba(255,255,255,.3)');
    C(X+7.3*T,Y+1.6*T,9,'#f0f0f0'); C(X+7.3*T,Y+1.6*T,5,'#3a8fd8'); tree(X+3.6*T,Y+7.2*T,11); tree(X+7.3*T,Y+7.2*T,11); break; }
  }
}
function drawLandmarkLabel(b){
  const l=b.lm, cx=b.X+4.5*T, y=b.Y+T+2;
  ctx.font='800 13px system-ui'; const w1=ctx.measureText(l.icon+' '+l.en).width; ctx.font='600 10px system-ui'; const w2=ctx.measureText(l.ru).width;
  const w=Math.max(w1,w2)+16;
  RR(cx-w/2,y,w,32,8,'rgba(20,24,32,.82)');
  txt(l.icon+' '+l.en,cx,y+11,13,'#ffd166'); txt(l.ru,cx,y+24,10,'#e6e9ef',false);
}
function drawSign(s){
  const {board:bd,awn,ref}=s;
  // полосатый навес
  ctx.save(); ctx.beginPath(); ctx.rect(awn.x,awn.y,awn.w,awn.h); ctx.clip(); R(awn.x,awn.y,awn.w,awn.h,ref.color);
  ctx.fillStyle='rgba(255,255,255,.85)'; if (awn.v) for (let i=0;i<awn.h;i+=12) ctx.fillRect(awn.x,awn.y+i,awn.w,6); else for (let i=0;i<awn.w;i+=12) ctx.fillRect(awn.x+i,awn.y,6,awn.h);
  ctx.restore();
  R(bd.x+3,bd.y+3,bd.w,bd.h,'rgba(0,0,0,.35)'); RR(bd.x,bd.y,bd.w,bd.h,5,ref.color);
  ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=1.5; ctx.strokeRect(bd.x+2.5,bd.y+2.5,bd.w-5,bd.h-5);
  if (s.kind==='shop'){ fitText(ref.brand,bd.x+bd.w/2,bd.y+12,bd.w-10,13,'#fff'); fitText(ref.type,bd.x+bd.w/2,bd.y+25,bd.w-10,9.5,'#ffe27a'); }
  else { fitText(ref.icon+' '+ref.en,bd.x+bd.w/2,bd.y+bd.h/2,bd.w-8,11,'#fff'); }
}
function drawCar(c){
  ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.ang); const L=c.len, Wd=c.wid;
  R(-L/2+4,-Wd/2+4,L,Wd,'rgba(0,0,0,.3)'); RR(-L/2,-Wd/2,L,Wd,5,c.color);
  if (c.bus){ R(-L/2+6,-Wd/2+3,L-14,Wd-6,shade(c.color,25)); for(let i=0;i<5;i++) R(-L/2+10+i*11,-Wd/2+1,7,2,'#223'); R(L/2-8,-Wd/2+3,5,Wd-6,'#1c2833'); }
  else { R(L/2-15,-Wd/2+2,7,Wd-4,'#1c2833'); R(-L/2+5,-Wd/2+3,6,Wd-6,'#1c2833'); R(-L/2+11,-Wd/2+3,L/2-2,Wd-6,shade(c.color.length===7?c.color:'#cccccc',-15));
    if (c.taxi){ R(-4,-5,8,10,'#f7d31a'); } }
  R(L/2-3,-Wd/2+2,3,4,'#fff6a8'); R(L/2-3,Wd/2-6,3,4,'#fff6a8'); R(-L/2,-Wd/2+2,2,4,'#e53935'); R(-L/2,Wd/2-6,2,4,'#e53935');
  ctx.restore();
}
function drawPlayer(){
  ctx.save(); ctx.translate(P.x,P.y); ctx.rotate(P.ang);
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(3,4,S.vehicle==='foot'?11:19,10,0,0,7); ctx.fill();
  const v=S.vehicle;
  if (v==='bicycle'){ R(-17,-2,9,4,'#111'); R(9,-2,9,4,'#111'); R(-10,-1.5,22,3,'#16a085'); R(11,-8,3,16,'#333'); }
  else if (v==='kick'){ RR(-15,-4,26,8,3,'#2d3436'); R(-17,-2,5,4,'#111'); R(11,-2,6,4,'#111'); R(12,-9,3,18,'#636e72'); }
  else if (v==='moto'){ ctx.fillStyle='#e63946'; ctx.beginPath(); ctx.ellipse(0,0,20,9,0,0,7); ctx.fill(); RR(-10,-5,13,10,4,'#222'); R(14,-10,3,20,'#444'); C(19,0,3,'#fff6a8'); }
  else { const s=Math.sin(P.walk)*5; ctx.fillStyle='#2d3436'; ctx.beginPath(); ctx.ellipse(s,-4,5,2.5,0,0,7); ctx.ellipse(-s,4,5,2.5,0,0,7); ctx.fill(); }
  // термокороб за спиной
  RR(-15,-9,10,18,2,'#f4c430'); R(-15,-1,10,2,'#b38b00');
  // тело и голова
  ctx.fillStyle = has('jacket') ? '#ff7f11' : '#3b82f6'; ctx.beginPath(); ctx.ellipse(-1,0,7,10,0,0,7); ctx.fill();
  if (has('jacket')){ R(-3,-10,2,20,'#ffd8a8'); }
  C(1,0,6,'#3b2414'); C(3,0,3.5,'#e0ac69');
  if (has('cap')){ C(0,0,6.5,'#1d4ed8'); RR(3,-5,6,10,3,'#1e40af'); C(0,0,1.5,'#fff'); }
  ctx.restore();
  if (P.stun>0){ for (let i=0;i<3;i++){ const a=perfT*6+i*2.1; txt('⭐',P.x+Math.cos(a)*14,P.y-18+Math.sin(a)*4,10,'#fff'); } }
  if (order && order.phase==='deliver'){ ctx.font='16px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(order.item.e,P.x,P.y-24); }
}
function drawTargets(){
  const t=targetPoint(); if (!t) return;
  const z = order.phase==='deliver' ? order.dest.zone : order.sign.zone, pulse=Math.sin(perfT*5)*.5+.5;
  ctx.strokeStyle=`rgba(255,200,61,${.5+pulse*.5})`; ctx.lineWidth=3; ctx.setLineDash([8,6]);
  ctx.strokeRect(z.x-3,z.y-3,z.w+6,z.h+6); ctx.setLineDash([]);
  ctx.fillStyle=`rgba(255,200,61,${.15+pulse*.15})`; ctx.fillRect(z.x,z.y,z.w,z.h);
  const by=t.y-34-pulse*8; ctx.fillStyle='#ffc83d'; ctx.beginPath(); ctx.moveTo(t.x-10,by); ctx.lineTo(t.x+10,by); ctx.lineTo(t.x,by+14); ctx.fill();
  ctx.strokeStyle='#000'; ctx.lineWidth=1.5; ctx.stroke();
}
function drawEdgeArrow(){
  const t=targetPoint(); if (!t) return;
  const sx=(t.x-camX)*zoom, sy=(t.y-camY)*zoom, m=40;
  const dist=Math.round(Math.hypot(t.x-P.x,t.y-P.y)/T*5);
  if (sx>m && sy>m && sx<VW-m && sy<VH-m) return;
  const px=(P.x-camX)*zoom, py=(P.y-camY)*zoom, a=Math.atan2(sy-py,sx-px);
  // точка пересечения с краем
  const k=Math.min(Math.abs((Math.cos(a)>0?VW-m-px:px-m)/Math.cos(a)||1e9), Math.abs((Math.sin(a)>0?VH-m-py:py-m)/Math.sin(a)||1e9));
  const top = VW<700 ? m : 160, bot = VW<700 ? VH-170 : VH-m;
  const ax=clamp(px+Math.cos(a)*k,m,VW-m), ay=clamp(py+Math.sin(a)*k,top,bot);
  ctx.save(); ctx.translate(ax,ay); ctx.rotate(a);
  ctx.fillStyle='#ffc83d'; ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(18,0); ctx.lineTo(-10,-13); ctx.lineTo(-4,0); ctx.lineTo(-10,13); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.font='800 12px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const lx=ax-Math.cos(a)*30, ly=ay-Math.sin(a)*30; ctx.fillStyle='rgba(0,0,0,.7)'; ctx.fillRect(lx-24,ly-9,48,18); ctx.fillStyle='#fff'; ctx.fillText(dist+' m',lx,ly);
}

function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#86b865'; ctx.fillRect(0,0,cv.width,cv.height);
  const vw=VW/zoom, vh=VH/zoom;
  camX = clamp(P.x-vw/2, 0, Math.max(0,WPX-vw)); camY = clamp(P.y-vh/2, 0, Math.max(0,HPX-vh));
  ctx.setTransform(dpr*zoom,0,0,dpr*zoom,-camX*dpr*zoom,-camY*dpr*zoom);
  // тайлы вне города (деревья, вода)
  const tx0=Math.max(0,Math.floor(camX/T)), ty0=Math.max(0,Math.floor(camY/T)), tx1=Math.min(W-1,Math.ceil((camX+vw)/T)), ty1=Math.min(H-1,Math.ceil((camY+vh)/T));
  for (let y=ty0;y<=ty1;y++) for (let x=tx0;x<=tx1;x++){ const t=grid[y*W+x];
    if (t===WATER && (y<ry(0)||y>ry(NH-1)+2)) R(x*T,y*T,T,T,'#3d8fd1');
    else if (t===TREE) tree(x*T+16,y*T+16,15,'#2e6b2a'); }
  drawRoads();
  for (const b of blocks){ if (!inView(b.X,b.Y,9*T,9*T)) continue;
    drawBlockBase(b);
    if (b.type==='canal') drawCanal(b);
    if (b.lm) drawLandmark(b); else if (b.type==='reg') drawRegular(b);
  }
  for (const s of SIGNS) if (inView(s.board.x-20,s.board.y-20,140,140)) drawSign(s);
  drawTargets();
  for (const p of peds){ const [x,y]=pedPos(p); if(!inView(x,y,1,1)) continue; C(x+2,y+2,5,'rgba(0,0,0,.2)'); C(x,y,5,p.c); C(x,y,3,'#4a3020'); }
  for (const c of cars) if (inView(c.x-40,c.y-40,80,80)) drawCar(c);
  drawPlayer();
  for (const b of blocks) if (b.lm && inView(b.X,b.Y,9*T,9*T)) drawLandmarkLabel(b);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawEdgeArrow();
}

// ---------- Главный цикл ----------
let last=performance.now(), hudT=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; perfT+=dt;
  if (!paused){
    updatePlayer(dt); updateCars(dt);
    for (const p of peds) p.s += p.dir*p.v*dt;
    checkZones();
    if (order) order.time -= dt;
    if (!order && nextOrderIn>0){ nextOrderIn-=dt; if (nextOrderIn<=0) newOrder(); }
  }
  render();
  hudT+=dt; if (hudT>.15){ hudT=0; updateTimer(); drawMini(); renderStats(); }
  requestAnimationFrame(frame);
}

// ---------- Ввод ----------
addEventListener('keydown', e => {
  if (modalOpen){ if (e.code==='Escape' && !modalNoClose) closeModal(); return; }
  keys[e.code]=true;
  if (e.code==='KeyM') openMap(); else if (e.code==='KeyB') openShop(); else if (e.code==='KeyN') openDict();
  else if (e.code==='KeyH') openHelp(); else if (e.code==='KeyF') useHint();
  else if (e.key==='+'||e.key==='='){ zoomUser=clamp(zoomUser*1.12,.5,2); resize(); } else if (e.key==='-'){ zoomUser=clamp(zoomUser/1.12,.5,2); resize(); }
  if (e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code]=false; });
addEventListener('blur', () => { for (const k in keys) keys[k]=false; });
const joyEl=$('joy');
cv.addEventListener('pointerdown', e => {
  if (e.pointerType==='mouse') return;
  if (joy.active) return;
  joy.active=true; joy.id=e.pointerId; joy.ox=e.clientX; joy.oy=e.clientY; joy.dx=joy.dy=0;
  joyEl.style.display='block'; joyEl.style.left=(e.clientX-60)+'px'; joyEl.style.top=(e.clientY-60)+'px'; joyEl.firstChild.style.transform='';
});
cv.addEventListener('pointermove', e => {
  if (!joy.active || e.pointerId!==joy.id) return;
  let dx=e.clientX-joy.ox, dy=e.clientY-joy.oy; const m=Math.hypot(dx,dy), R0=50;
  if (m>R0){ dx*=R0/m; dy*=R0/m; }
  joy.dx=dx/R0; joy.dy=dy/R0; if (m<8){ joy.dx=joy.dy=0; }
  joyEl.firstChild.style.transform=`translate(${dx}px,${dy}px)`;
});
const joyEnd = e => { if (e.pointerId!==joy.id) return; joy.active=false; joy.dx=joy.dy=0; joyEl.style.display='none'; };
cv.addEventListener('pointerup', joyEnd); cv.addEventListener('pointercancel', joyEnd);
$('mini').onclick=openMap; $('bMap').onclick=openMap; $('bShop').onclick=openShop; $('bDict').onclick=openDict; $('bHelp').onclick=openHelp;
function voiceBtn(){ $('bVoice').textContent = S.voice ? '🔊 Голос: вкл' : '🔇 Голос: выкл'; }
$('bVoice').onclick = () => { S.voice=!S.voice; save(); voiceBtn(); if (S.voice) say('Hello!'); };
voiceBtn();
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};

resize(); renderStats(); openStart(); requestAnimationFrame(frame);
window.__game = {P, S, SIGNS, DESTS, get order(){return order;}, newOrder, cars};
</script>
