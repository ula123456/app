<style>
:root{
  color-scheme:dark;
  --panel:rgba(16,22,38,.72); --panel2:rgba(26,32,50,.96); --text:#fff; --muted:#b8c3d6;
  --accent:#ffd23f; --good:#3ddc84; --bad:#ff5c5c; --blue:#4da3ff;
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px); --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --pix:"Press Start 2P","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#79c3f2;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(6px + var(--st)) calc(8px + var(--sr)) 0 calc(8px + var(--sl));display:none;gap:8px;align-items:flex-start;pointer-events:none}
#hud .col{display:flex;flex-direction:column;gap:2px;text-shadow:0 2px 0 rgba(0,0,0,.45)}
#hud .lbl{font:13px var(--pix);letter-spacing:1px;opacity:.9}
#hud .val{font:20px var(--pix)}
#hud .mid{flex:1;align-items:center;min-width:0}
#hud .route{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#prog{width:min(480px,100%);height:30px;display:block}
#pauseBtn{pointer-events:auto;width:48px;height:48px;border-radius:12px;border:0;background:var(--panel);color:#fff;font-size:24px;cursor:pointer}
#order{position:fixed;left:50%;transform:translateX(-50%);top:calc(84px + var(--st));padding:8px 16px;border-radius:12px;background:var(--panel);font-size:18px;font-weight:700;display:none;white-space:nowrap;max-width:calc(100vw - 16px);overflow:hidden;text-overflow:ellipsis;pointer-events:auto;cursor:pointer}
#order .en{color:var(--accent)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--sb));display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(620px,calc(100vw - 20px))}
.toast{background:var(--panel2);padding:8px 16px;border-radius:12px;font-size:17px;font-weight:600;box-shadow:0 3px 12px rgba(0,0,0,.35);animation:tin .2s ease-out;text-align:center}
.toast.good{border-left:4px solid var(--good)} .toast.bad{border-left:4px solid var(--bad)} .toast.info{border-left:4px solid var(--blue)}
.toast b{color:var(--accent)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
#pad{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:0 calc(14px + var(--sr)) calc(14px + var(--sb)) calc(14px + var(--sl));pointer-events:none}
#dpad{position:relative;width:186px;height:186px;pointer-events:auto}
#dpad button{position:absolute;width:62px;height:62px;border-radius:12px;border:2px solid rgba(255,255,255,.6);background:rgba(16,22,38,.55);color:#fff;font-size:26px;font-weight:900;touch-action:none;padding:0}
#kL{left:0;top:62px} #kR{right:0;top:62px} #kD{left:62px;bottom:0} #kU{left:62px;top:0}
#dpad .hub{position:absolute;left:62px;top:62px;width:62px;height:62px;background:rgba(16,22,38,.55);border-radius:6px}
#abtn{display:flex;gap:16px;align-items:flex-end;pointer-events:auto;padding-bottom:10px}
#abtn .b{display:flex;flex-direction:column;align-items:center;gap:4px;font:12px var(--pix);color:#fff;text-shadow:0 2px 0 #000}
#abtn button{width:80px;height:80px;border-radius:50%;border:3px solid rgba(255,255,255,.7);color:#fff;font:26px var(--pix);touch-action:none;padding:0}
#kRun{background:rgba(52,120,220,.75)} #kJump{background:rgba(214,48,49,.8);width:92px!important;height:92px!important;margin-bottom:26px}
#pad button.on{filter:brightness(1.5);transform:scale(.94)}
#modalWrap{position:fixed;inset:0;background:rgba(6,10,24,.6);display:none;align-items:center;justify-content:center;padding:calc(10px + var(--st)) calc(10px + var(--sr)) calc(10px + var(--sb)) calc(10px + var(--sl));z-index:10}
#modal{touch-action:pan-y;overscroll-behavior:contain;background:#1d2440;border:3px solid #ffd23f;border-radius:14px;max-width:780px;width:100%;max-height:100%;overflow:auto;padding:16px 18px;box-shadow:0 10px 0 rgba(0,0,0,.35);-webkit-user-select:text;user-select:text}
#modal{font-size:16px}
#modal h2{margin:0 0 8px;font-size:24px;text-wrap:balance}
#modal h2.pix{font:22px/1.5 var(--pix);color:var(--accent)}
#modal h3{margin:14px 0 6px;font-size:15px;color:var(--accent)}
#modal p{margin:6px 0;line-height:1.5;font-size:16px;color:#dfe5f1}
button{font:inherit;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;background:#3a4568;color:#fff;font-weight:700}
button:hover{filter:brightness(1.15)} button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:#1a1a1a} button.good{background:var(--good);color:#06301a}
button.small{padding:4px 9px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.card{background:#28315a;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card .em{font-size:32px} .card .en{font-weight:800;color:var(--accent);font-size:16px}
.muted{color:var(--muted);font-size:14px}
.opts{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0} .opts button{font-size:18px;padding:12px 18px;flex:1;min-width:110px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.word{background:#28315a;border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.word b{color:var(--accent)} .lock{opacity:.35}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0} .seg label{background:#28315a;padding:8px 12px;border-radius:9px;cursor:pointer;flex:1;min-width:0}
details{background:#28315a;border-radius:10px;padding:8px 12px;margin:8px 0} summary{cursor:pointer;font-weight:800;color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:10px 0}
.lvl{background:#28315a;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;border:2px solid transparent}
.lvl:hover{border-color:var(--accent)} .lvl[disabled]{opacity:.45;cursor:not-allowed}
.lvl .no{font:13px var(--pix);color:var(--accent)} .lvl .nm{font-weight:800;font-size:18px}
.line{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:800;color:#fff}
kbd{background:#3a4568;border-radius:4px;padding:1px 6px;font-size:12px}
body.touch #toasts{bottom:calc(200px + var(--sb))}
body.touch.gest #toasts{bottom:calc(16px + var(--sb))}
@media (orientation:landscape){ body.touch #toasts{bottom:calc(8px + var(--sb));width:min(44vw,520px)} body.touch .toast{font-size:13px;padding:5px 10px} body.touch #order{font-size:14px;top:calc(64px + var(--st))} #dpad{transform:scale(.72);transform-origin:left bottom} #abtn{transform:scale(.72);transform-origin:right bottom} }
@media (max-width:700px){ #hud .lbl{font-size:10px} #hud .val{font-size:15px} #hud .route{font-size:13px} #order{font-size:15px;top:calc(72px + var(--st))} .toast{font-size:14px} #dpad{transform:scale(.85);transform-origin:left bottom} #abtn{transform:scale(.85);transform-origin:right bottom} }
@media (prefers-reduced-motion:reduce){ .toast{animation:none} }
</style>

let AC = null;
function beep(f=660,d=.08,type='sine',vol=.08,delay=0){
  try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); const t=AC.currentTime+delay;
    const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02); }catch(e){}
}
const sfx = {
  coin(){ beep(988,.08,'square',.05); beep(1319,.18,'square',.05,.08); },
  ok(){ beep(523,.1,'triangle',.08); beep(784,.15,'triangle',.08,.1); },
  bad(){ beep(220,.18,'sawtooth',.05); },
  honk(){ beep(330,.15,'square',.03); beep(415,.15,'square',.03); },
  ping(){ beep(880,.12,'sine',.07); },
};
function say(text){
  if (!S.voice || !window.speechSynthesis) return;
  try{ const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=.9;
    const v=speechSynthesis.getVoices().find(v=>/^en(-|_)US/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang)); if(v) u.voice=v;
    speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}

// ---------- Построение уровня ----------
function newMap(w,theme){ return {w,theme,t:new Uint8Array(w*MH),deco:[],coins:[],enemies:[],doors:[],cars:[],lms:[],signs:[],checks:[],spawn:{x:3*TS,y:GROUND*TS}}; }
function tset(m,x,y,v){ if(x>=0&&x<m.w&&y>=0&&y<MH) m.t[y*m.w+x]=v; }
function tget(m,x,y){ if (x<0||x>=m.w) return WALL; if (y<0||y>=MH) return E; return m.t[y*m.w+x]; }
function buildSurface(L, slots){
  const m=newMap(900,'street'); let x=0; m.level=L;
  const ground=n=>{ for(let i=0;i<n;i++) for(let y=GROUND;y<MH;y++) tset(m,x+i,y,GND); x+=n; };
  const out={exitX:0,passExit:0};
  for (const [cmd,a,b] of L.script){
    switch(cmd){
      case 'flat': ground(a); break;
      case 'gap': m.deco.push({k:'barrier',x:x-1},{k:'barrier',x:x+a}); m.deco.push({k:'pit',x,n:a}); x+=a; break;
      case 'coins': for(let i=0;i<a;i++) m.coins.push({x:(x+i)*TS+16,y:b*TS+16,got:false}); break;
      case 'crates': a.forEach(h=>{ ground(1); for(let j=1;j<=h;j++) tset(m,x-1,GROUND-j,BLK); if (Math.random()<.5) m.coins.push({x:(x-1)*TS+16,y:(GROUND-h-1)*TS+16,got:false}); }); break;
      case 'shop': { const x0=x; ground(7); const sh=slots[a]; m.deco.push({k:'shop',x:x0,shop:sh}); for(let i=1;i<6;i++) tset(m,x0+i,9,ONE);
        m.doors.push({kind:'shop',shop:sh,x0:(x0+2.5)*TS,x1:(x0+4.5)*TS,label:sh.brand}); m.coins.push({x:(x0+2)*TS+16,y:8*TS+8,got:false},{x:(x0+4)*TS+16,y:8*TS+8,got:false}); break; }
      case 'enemy': m.enemies.push({x:(x+a-2)*TS,y:GROUND*TS-30,w:30,h:30,min:x*TS,max:(x+a)*TS,dir:-1,stun:0}); break;
      case 'lm': m.lms.push({key:a,x:x*TS}); break;
      case 'street': m.signs.push({x:(x+2)*TS,uz:a,en:b}); break;
      case 'check': m.checks.push({x:x*TS+16}); break;
      case 'metro': { const x0=x; ground(7); m.deco.push({k:'metro',x:x0,st:L.metro.st[0],line:L.metro.line});
        m.doors.push({kind:'metro',x0:(x0+2.5)*TS,x1:(x0+4.5)*TS,label:'Metro «'+ST[L.metro.st[0]][0]+'»'}); break; }
      case 'metroExit': { const x0=x; ground(7); m.deco.push({k:'metroExit',x:x0,st:L.metro.st[L.metro.st.length-1],line:L.metro.line}); out.exitX=(x0+3.5)*TS; break; }
      case 'passage': { const x0=x; ground(5); m.deco.push({k:'passage',x:x0}); m.doors.push({kind:'passage',x0:(x0+1.5)*TS,x1:(x0+3.5)*TS,label:"Yer osti o'tish joyi"}); break; }
      case 'passageExit': { const x0=x; ground(5); m.deco.push({k:'passageExit',x:x0}); out.passExit=(x0+2.5)*TS; break; }
      case 'road': { const x0=x; ground(a); m.deco.push({k:'road',x:x0,n:a}); for(let i=0;i<2;i++) m.cars.push({x0:x0*TS-160,x1:(x0+a)*TS+160,x:(x0+a)*TS+160-i*(a*TS/2+200),w:92,h:40,v:150+Math.random()*80,c:pick(['#f2f2f2','#f2f2f2','#d0d4d8','#2c3e50','#c0392b','#f7d31a'])}); break; }
      case 'bridge': case 'elevated': { const x0=x;
        for (let s=1;s<=5;s++){ ground(1); for(let j=1;j<=s;j++) tset(m,x-1,GROUND-j,STEP); }
        const d0=x; ground(a); for(let i=0;i<a;i++) tset(m,d0+i,GROUND-5,ONE);
        for (let s=5;s>=1;s--){ ground(1); for(let j=1;j<=s;j++) tset(m,x-1,GROUND-j,STEP); }
        m.deco.push({k:cmd,x:d0,n:a}); for(let i=1;i<a-1;i+=2) m.coins.push({x:(d0+i)*TS+16,y:(GROUND-7)*TS+16,got:false});
        if (cmd==='bridge') m.enemies.push({x:(d0+a-3)*TS,y:(GROUND-5)*TS-30,w:30,h:30,min:d0*TS,max:(d0+a)*TS,dir:-1,stun:0});
        break; }
      case 'finish': { const x0=x; ground(10); m.deco.push({k:'finish',x:x0,lm:L.finish}); m.doors.push({kind:'finish',x0:(x0+3.5)*TS,x1:(x0+6.5)*TS,label:LM[L.finish].en}); m.finishX=(x0+5)*TS; break; }
    }
  }
  for (let y=0;y<MH;y++) tset(m,x,y,WALL);
  const W0=x+1, t=new Uint8Array(W0*MH); for (let y=0;y<MH;y++) for (let i=0;i<W0;i++) t[y*W0+i]=m.t[y*m.w+i];
  m.t=t; m.w=W0;
  return {m,out};
}
const makeSurface=buildSurface;
function makeMetro(L){
  const m=newMap(66,'metro'); m.line=L.metro.line; m.st=L.metro.st;
  for (let x=0;x<m.w;x++){ for(let y=0;y<2;y++) tset(m,x,y,WALL); for(let y=GROUND;y<MH;y++) tset(m,x,y,GND); }
  for (let y=0;y<MH;y++){ tset(m,30,y,WALL); tset(m,31,y,WALL); }
  [[5,9,4],[22,9,4],[38,9,5],[49,8,4]].forEach(([x0,y,n])=>{ for(let i=0;i<n;i++){ tset(m,x0+i,y,ONE); m.coins.push({x:(x0+i)*TS+16,y:(y-1)*TS+16,got:false}); } });
  for (let i=0;i<6;i++) m.coins.push({x:(10+i)*TS+16,y:(GROUND-1)*TS+16,got:false}),m.coins.push({x:(41+i*2)*TS+16,y:(GROUND-1)*TS+16,got:false});
  m.spawn={x:3*TS,y:GROUND*TS}; m.spawnB={x:35*TS,y:GROUND*TS};
  m.doors.push({kind:'train',x0:17*TS,x1:19.5*TS,label:'Поезд → '+ST[m.st[m.st.length-1]][0]},{kind:'exit',x0:60*TS,x1:63*TS,label:"Chiqish · Выход"});
  m.halls=[{x0:0,x1:30,st:m.st[0]},{x0:32,x1:66,st:m.st[m.st.length-1]}];
  return m;
}
function makePassage(){
  const m=newMap(34,'passage');
  for (let x=0;x<m.w;x++){ for(let y=0;y<4;y++) tset(m,x,y,WALL); for(let y=GROUND;y<MH;y++) tset(m,x,y,GND); }
  for (let i=0;i<10;i++) m.coins.push({x:(8+i*2)*TS+16,y:(GROUND-2)*TS+16,got:false});
  [[12,9,3],[20,8,3]].forEach(([x0,y,n])=>{ for(let i=0;i<n;i++) tset(m,x0+i,y,ONE); });
  m.spawn={x:2.5*TS,y:GROUND*TS}; m.doors.push({kind:'pexit',x0:29*TS,x1:32*TS,label:'Chiqish · Выход'});
  return m;
}

const P={x:0,y:0,w:20,h:30,vx:0,vy:0,onG:false,face:1,coy:0,buf:0,inv:0,anim:0,hold:0};
function startLevel(i){
  lvlIdx=i; const L=LEVELS[i];
  const correct=pick(SHOPS), others=shuffle(SHOPS.filter(s=>s!==correct)).slice(0,3), slots=shuffle([correct,...others]);
  const sur=makeSurface(L,slots);
  maps={surface:sur.m, metro:makeMetro(L), passage:makePassage(), exitX:sur.out.exitX, passExit:sur.out.passExit};
  const item=pick(correct.items);
  order={shop:correct,item,got:false,hint:S.diff==='easy'?1:0,hintCost:0,lm:L.finish};
  timeLeft=L.time+(has('bag')?15:0); startMoney=S.money;
  enterMap(maps.surface,9*TS,GROUND*TS); checkpoint={x:9*TS,y:GROUND*TS};
  state='play'; closeModal(true); showHud(true); G.fingers.clear(); G.move=null; keys.pL=keys.pR=keys.pB=keys.pJ=false; if (touchUI&&S.ctrl!=='buttons'&&lvlIdx===0||!S.seenGest){ gHintT=perfT; S.seenGest=true; save(); }
  toast(`📱 Заказ: <b>${item.e} ${item.ru}</b> → ${LM[L.finish].icon} ${LM[L.finish].en}`,'info'); sfx.ping();
  renderOrder();
}
function enterMap(m,x,y){ map=m; P.x=x; P.y=y-P.h; P.vx=0; P.vy=0; P.onG=false; }
function doFade(label,fn){ fade={t:0,label,fn,done:false}; }
function respawn(){ const fine=Math.min(S.money,1000); S.money-=fine; save();
  toast(`🕳 Ой! Яма на дороге. ${fine?'−'+fmt(fine):''}`,'bad'); sfx.bad(); enterMap(maps.surface,checkpoint.x,checkpoint.y); P.inv=1.2; }
function hurt(dir){

  const fine=Math.min(S.money,1500); S.money-=fine; save();

}

// ---------- Физика ----------
const solid=t=>t===GND||t===BLK||t===STEP||t===WALL;
const keys={};
function inp(){ return {
  l:keys.ArrowLeft||keys.KeyA||keys.pL, r:keys.ArrowRight||keys.KeyD||keys.pR,
  j:keys.Space||keys.ArrowUp||keys.KeyW||keys.KeyZ||keys.KeyK||keys.pJ, d:keys.ArrowDown||keys.KeyS||keys.KeyE||keys.pD,
  b:keys.ShiftLeft||keys.ShiftRight||keys.KeyX||keys.KeyJ||keys.pB }; }
let jumpHeld=false, downHeld=false, pressJ=false, pressD=false;
function updatePlayer(dt){
  const k=inp(), vm=VMUL[S.vehicle]||1;
  const walkV=150*vm, runV=255*vm, maxV=k.b?runV:walkV;
  const dir=(k.r?1:0)-(k.l?1:0);
  P.skid=false;
  if (dir){
    if (P.onG && P.vx*dir<0 && Math.abs(P.vx)>60){ P.vx+=dir*1900*dt; P.skid=true; }      // занос при развороте
    else P.vx+=dir*(P.onG?(k.b?620:520):430)*dt;                                         // разгон
    if (P.onG || Math.abs(P.vx)<40) P.face=dir;
    if (Math.abs(P.vx)>maxV){ const f=(P.onG?700:150)*dt; P.vx=Math.sign(P.vx)*Math.max(maxV,Math.abs(P.vx)-f); }
  } else { const f=(P.onG?560:120)*dt; P.vx=Math.abs(P.vx)<=f?0:P.vx-Math.sign(P.vx)*f; }  // скольжение по инерции
  if ((k.j && !jumpHeld) || pressJ) P.buf=.12; jumpHeld=!!k.j; pressJ=false;
  P.buf-=dt; P.coy-=dt; if (P.onG) P.coy=.08;
  if (P.buf>0 && P.coy>0){ const sp=Math.abs(P.vx)/runV;                                 // с разбега прыжок выше
    P.vy=-(560+130*clamp(sp,0,1))*(S.vehicle==='moto'?1.06:1); P.buf=0; P.coy=0; P.onG=false; sfx.jump(); }
  const g = (k.j && P.vy<0) ? 1400 : 2600;                                               // держишь «A» — летишь выше
  P.vy=Math.min(P.vy+g*dt,820);
  // X
  P.x+=P.vx*dt;
  { const y0=Math.floor(P.y/TS), y1=Math.floor((P.y+P.h-1)/TS);
    if (P.vx>0){ const tx=Math.floor((P.x+P.w)/TS); for(let y=y0;y<=y1;y++) if (solid(tget(map,tx,y))){ P.x=tx*TS-P.w-.01; P.vx=0; break; } }
    else if (P.vx<0){ const tx=Math.floor(P.x/TS); for(let y=y0;y<=y1;y++) if (solid(tget(map,tx,y))){ P.x=(tx+1)*TS+.01; P.vx=0; break; } } }
  // Y
  const prevBottom=P.y+P.h; P.y+=P.vy*dt; P.onG=false;
  { const x0=Math.floor(P.x/TS), x1=Math.floor((P.x+P.w-1)/TS);
    if (P.vy>=0){ const ty=Math.floor((P.y+P.h)/TS);
      for (let x=x0;x<=x1;x++){ const t=tget(map,x,ty); if (solid(t)||(t===ONE&&prevBottom<=ty*TS+2)){ P.y=ty*TS-P.h; P.vy=0; P.onG=true; break; } } }
    else { const ty=Math.floor(P.y/TS); for (let x=x0;x<=x1;x++) if (solid(tget(map,x,ty))){ P.y=(ty+1)*TS; P.vy=0; break; } } }
  P.inv-=dt; P.anim+=Math.abs(P.vx)*dt*.05;
  if (P.y>WH+60) respawn();
  // монеты
  for (const c of map.coins) if (!c.got && Math.abs(c.x-(P.x+P.w/2))<20 && Math.abs(c.y-(P.y+P.h/2))<24){ c.got=true; S.money+=500; sfx.coin(); spark(c.x,c.y); }
  // контрольные точки
  if (map===maps.surface) for (const c of map.checks) if (P.x>c.x && checkpoint.x<c.x){ checkpoint={x:c.x,y:GROUND*TS}; toast('🚩 Контрольная точка','good'); }
  // двери
  const cx=P.x+P.w/2; let door=null; for (const d of map.doors) if (cx>d.x0 && cx<d.x1 && P.onG) door=d;
  curDoor=door;
  if (((k.d && !downHeld) || pressD) && door) useDoor(door); downHeld=!!k.d; pressD=false;
}

function useDoor(d){

function updateRide(dt){

function updateEnemies(dt){
  for (const e of map.enemies){
    if (e.stun>0){ e.stun-=dt; } else { e.x+=e.dir*60*dt; if (e.x<e.min){ e.x=e.min; e.dir=1; } if (e.x+e.w>e.max){ e.x=e.max-e.w; e.dir=-1; } }
    if (P.x<e.x+e.w && P.x+P.w>e.x && P.y<e.y+e.h && P.y+P.h>e.y){
      if (P.vy>0 && P.y+P.h-e.y<16){ P.vy=-420; if (e.stun<=0){ e.stun=3; sfx.stomp(); toast('🛴 <b>Sorry!</b> — Извините!','info'); say('Sorry!'); } }
      else if (e.stun<=0) hurt(P.x<e.x?-1:1);
    }
  }
  for (const c of map.cars){
    c.x-=c.v*dt; if (c.x+c.w<c.x0) c.x=c.x1;
    const cy=GROUND*TS-c.h;
    if (P.x<c.x+c.w && P.x+P.w>c.x && P.y<cy+c.h && P.y+P.h>cy){
      if (P.vy>0 && P.y+P.h-cy<18){ P.vy=-460; sfx.stomp(); }
      else hurt(P.x<c.x+c.w/2?-1:1);
    }
  }
}

function finishLevel(){
  state='quiz'; const o=order, late=timeLeft<0;
  const others=ALLWORDS.filter(w=>w.cat==='item'&&w.en!==o.item.en);
  const opts=[o.item.en]; while(opts.length<3){ const w=pick(others).en; if(!opts.includes(w)) opts.push(w); }
  shuffle(opts); say('Thank you! What did you bring?');
  openModal(`<h2>🙂 Customer: “Thank you! What did you bring?”</h2>
    <p>Клиент спрашивает: <b>«Спасибо! Что ты принёс?»</b> Выбери английское слово — за правильный ответ получишь чаевые (tip).</p>

    <div class="opts">${opts.map(w=>`<button data-w="${w}">${w}</button>`).join('')}</div><div id="quizRes"></div>`,{noClose:true});

    const ok=btn.dataset.w===o.item.en;
    document.querySelectorAll('#modal .opts button').forEach(b=>{ b.disabled=true; if(b.dataset.w===o.item.en) b.className='good'; });
    if (!ok) btn.style.background='var(--bad)';
    ok?(sfx.ok(),say('Yes! '+o.item.en+'. Thank you!')):(sfx.bad(),say('No, it is '+o.item.en));
    const L=LEVELS[lvlIdx], base=12000+lvlIdx*4000;
    const basePay=round500(base*(late?.4:1)*(has('jacket')?1.15:1)), tip=ok?round500(base*.25*(has('cap')?1.25:1)):0;
    const pay=Math.max(1000,basePay+tip-o.hintCost), coins=S.money-startMoney;
    S.money+=pay; S.earned+=pay; S.delivered++; if(!late) S.onTime++;
    S.unlocked=Math.max(S.unlocked,Math.min(LEVELS.length,lvlIdx+2));
    const tUsed=Math.round(L.time+(has('bag')?15:0)-timeLeft); if (!late && (!S.best[lvlIdx]||tUsed<S.best[lvlIdx])) S.best[lvlIdx]=tUsed;
    save(); setTimeout(sfx.coin,250);
    const lm=LM[o.lm];
    $('quizRes').innerHTML=`<h3>${late?'⏰ Доставлено с опозданием':'🚀 Доставлено вовремя!'} · ${tUsed} с</h3>
      <p>Оплата: <b>${fmt(basePay)}</b>${tip?` · чаевые <b>${fmt(tip)}</b>`:''}${o.hintCost?` · подсказки −${fmt(o.hintCost)}`:''}${coins>0?`<br>Монеты по пути: <b>${fmt(coins)}</b>`:''}
      <br><span style="font-size:22px;color:var(--good);font-weight:800">+${fmt(pay)}</span> → в кошелёк 👛</p>
      <p>📍 <b>${lm.en}</b> — ${lm.ru}.<br><span class="muted">${lm.fact}</span></p>
      <div class="row" style="justify-content:flex-end"><button id="toMenu">Маршруты</button>
      ${lvlIdx<LEVELS.length-1?'<button class="primary" id="nextLvl">Следующий маршрут ▶</button>':'<button class="primary" id="nextLvl">Ещё раз ▶</button>'}</div>`;
    $('toMenu').onclick=()=>showMenu();

  });
}

const prog=$('prog'), pctx=prog.getContext('2d');
function drawProg(){
  const w=prog.clientWidth, h=prog.clientHeight, dp=Math.min(2,devicePixelRatio||1); if (!w) return;
  if (prog.width!==Math.round(w*dp)){ prog.width=Math.round(w*dp); prog.height=Math.round(h*dp); }
  pctx.setTransform(dp,0,0,dp,0,0); pctx.clearRect(0,0,w,h);
  const m=maps.surface, X=x=>8+(w-16)*x/(m.w*TS);
  pctx.fillStyle='rgba(0,0,0,.35)'; pctx.fillRect(8,13,w-16,6); pctx.fillStyle='#ffd23f';
  let px=map===maps.surface?P.x:(map===maps.metro? (P.x<31*TS?maps.surface.doors.find(d=>d.kind==='metro').x0 : maps.exitX) : maps.passExit);
  pctx.fillRect(8,13,X(px)-8,6);
  pctx.font='17px system-ui'; pctx.textAlign='center'; pctx.textBaseline='middle';
  m.lms.forEach(l=>pctx.fillText(LM[l.key].icon,X(l.x+120),14));
  const md=m.deco.find(d=>d.k==='metro'), me=m.deco.find(d=>d.k==='metroExit');
  if (md&&me){ const c=LINES[m.level.metro.line].c; pctx.strokeStyle=c; pctx.lineWidth=3; pctx.setLineDash([3,3]); pctx.beginPath(); pctx.moveTo(X(md.x*TS),25); pctx.lineTo(X(me.x*TS),25); pctx.stroke(); pctx.setLineDash([]);
    [md,me].forEach(d=>{ pctx.fillStyle=c; pctx.beginPath(); pctx.arc(X(d.x*TS),25,4,0,7); pctx.fill(); }); }

}

let last=performance.now(), hudT=0;

  const dt=Math.min(.033,(now-last)/1000); last=now; perfT+=dt;

    else { updatePlayer(dt); updateEnemies(dt); }
    timeLeft-=dt;
    for (let i=sparks.length-1;i>=0;i--){ const s=sparks[i]; s.t-=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=500*dt; if (s.t<=0) sparks.splice(i,1); }
  } else if (state==='ride'){ updateRide(dt); timeLeft-=dt; }
  render();
  hudT+=dt; if (hudT>.12 && (state==='play'||state==='ride')){ hudT=0; renderHud(); drawProg(); }
  requestAnimationFrame(frame);
}

// ---------- Ввод ----------
addEventListener('keydown',e=>{
  if (modalOpen){ if (e.code==='Escape'&&!modalNoClose) closeModal(); return; }
  if (e.code==='Escape'||e.code==='KeyP'){ showPause(); return; }
  if (e.code==='KeyF') useHint();
  if (!e.repeat){ if (['ArrowDown','KeyS','KeyE'].includes(e.code)) pressD=true; if (['Space','ArrowUp','KeyW','KeyZ','KeyK'].includes(e.code)) pressJ=true; }
  keys[e.code]=true; if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup',e=>{ keys[e.code]=false; });
addEventListener('blur',()=>{ for (const k in keys) keys[k]=false; });
function bindPad(id,k){ const b=$(id); const on=e=>{ e.preventDefault(); keys[k]=true; if (k==='pD') pressD=true; if (k==='pJ') pressJ=true; b.classList.add('on'); }, off=e=>{ keys[k]=false; b.classList.remove('on'); };
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off); b.addEventListener('pointerleave',off); }
bindPad('kL','pL'); bindPad('kR','pR'); bindPad('kJump','pJ'); bindPad('kU','pJ'); bindPad('kD','pD'); bindPad('kRun','pB');
// ---------- Управление касаниями ----------
const G={move:null,fingers:new Map()};
function gestOn(){ return touchUI && S.ctrl!=='buttons' && (state==='play') && !modalOpen; }
function playerScreenX(){ return (P.x+P.w/2-camX)*sc; }
function gestSteer(f){
  const dx=f.x-playerScreenX();
  keys.pL = dx<-24; keys.pR = dx>24;
  keys.pB = performance.now()-f.t0>350;
}
cv.addEventListener('pointerdown',e=>{
  if (e.pointerType!=='touch' || !gestOn()) return; e.preventDefault();
  const f={id:e.pointerId,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,t0:performance.now(),up:false,dn:false,jump:false,moved:0};
  G.fingers.set(e.pointerId,f);
  if (!G.move){ G.move=f; gestSteer(f); }
  else { f.jump=true; pressJ=true; keys.pJ=true; }        // второй палец — прыжок
});
cv.addEventListener('pointermove',e=>{
  const f=G.fingers.get(e.pointerId); if (!f) return;
  f.moved=Math.max(f.moved,Math.hypot(e.clientX-f.x0,e.clientY-f.y0)); f.x=e.clientX; f.y=e.clientY;
  if (f===G.move) gestSteer(f);
  const dy=f.y-f.y0;
  if (!f.up && dy<-40){ f.up=true; f.jump=true; pressJ=true; keys.pJ=true; f.y0=f.y; }   // свайп вверх — прыжок
  if (!f.dn && dy>45){ f.dn=true; pressD=true; f.y0=f.y; }                           // свайп вниз — войти
  if (f.up && dy>20){ f.up=false; }
  if (f.dn && dy<-20){ f.dn=false; }
});
function gestEnd(e){
  const f=G.fingers.get(e.pointerId); if (!f) return; G.fingers.delete(e.pointerId);
  if (f===G.move && !f.jump && !f.dn && performance.now()-f.t0<220 && f.moved<14){ pressJ=true; keys.pJ=true; setTimeout(()=>{ if (![...G.fingers.values()].some(g=>g.jump)) keys.pJ=false; },90); }
  if (f.jump && ![...G.fingers.values()].some(g=>g.jump)) keys.pJ=false;
  if (f===G.move){ G.move=[...G.fingers.values()][0]||null; if (G.move){ G.move.jump=false; gestSteer(G.move); } else { keys.pL=keys.pR=keys.pB=false; } }
}
cv.addEventListener('pointerup',gestEnd); cv.addEventListener('pointercancel',gestEnd);
function drawGest(){
  if (!gestOn()) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  for (const f of G.fingers.values()){
    ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(f.x,f.y,30,0,7); ctx.stroke();
    ctx.fillStyle='rgba(255,210,63,.25)'; ctx.beginPath(); ctx.arc(f.x,f.y,30,0,7); ctx.fill();
    if (f===G.move){ const t=keys.pL?'◀':keys.pR?'▶':''; if (t) txt(t+(keys.pB?t:''),f.x,f.y-50,26,'#fff','900'); }
    if (f.jump) txt('A',f.x,f.y,20,'#fff','900');
  }
  if (perfT-gHintT<6 && G.fingers.size===0){
    const a=Math.min(1,(6-(perfT-gHintT))/1.5); ctx.globalAlpha=a;
    const y=VH*.62; RR(VW/2-170,y-50,340,100,16,'rgba(16,22,38,.75)');
    txt('👆 держи палец слева / справа — идти',VW/2,y-24,15,'#fff','800'); txt('↑ свайп или 2-й палец — прыжок',VW/2,y,15,'#ffd23f','800'); txt('↓ свайп вниз — войти',VW/2,y+24,15,'#fff','800');
    ctx.globalAlpha=1;
  }
}
let gHintT=-100;
addEventListener('pointerdown',e=>{ if (e.pointerType==='touch' && !touchUI){ touchUI=true; resize(); if (state==='play') showHud(true); } },{capture:true});

resize(); showMenu(); requestAnimationFrame(frame);
window.__game={P,S,get map(){return map;},get maps(){return maps;},get order(){return order;},get state(){return state;},startLevel,useDoor,keys};
</script>
