<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tashkent Courier</title>
<style>
:root{
  color-scheme:dark;
  --panel:rgba(18,22,30,.78); --panel2:rgba(28,34,46,.95); --text:#f3f5f8; --muted:#a9b3c2;
  --accent:#ffc83d; --good:#3ddc84; --bad:#ff5c5c; --blue:#4da3ff;
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px); --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1f27;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.panel{background:var(--panel);border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.3);backdrop-filter:blur(4px)}
#stats{position:fixed;left:calc(8px + var(--sl));top:calc(8px + var(--st));padding:5px 10px;display:flex;gap:10px;font-weight:700;font-size:13px;pointer-events:none}
#stats span{white-space:nowrap}
#mini{position:fixed;right:calc(8px + var(--sr));top:calc(8px + var(--st));width:170px;height:128px;border-radius:12px;cursor:pointer;border:2px solid rgba(255,255,255,.18);background:#223}
#order{position:fixed;left:50%;top:calc(8px + var(--st));transform:translateX(-50%);width:min(400px,calc(100vw - 420px));min-width:280px;padding:7px 11px;font-size:13px;line-height:1.3;display:none;cursor:pointer}
#order.late{outline:2px solid var(--bad)}
#order .row{display:flex;align-items:center;gap:7px;margin-top:5px}
#order .big{font-size:15px;font-weight:800}
#order .en{color:var(--accent);font-weight:800;letter-spacing:.4px}
#order .bar{height:5px;background:#39404e;border-radius:4px;overflow:hidden;flex:1}
#order .bar i{display:block;height:100%;background:var(--good);width:100%}
#order.late .bar i{background:var(--bad)}
#order.min .more{display:none}
button{font:inherit;border:0;border-radius:9px;padding:7px 12px;cursor:pointer;background:#3a4354;color:var(--text);font-weight:700}
button:hover{filter:brightness(1.15)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:#222}
button.good{background:var(--good);color:#06301a}
button.small{padding:3px 8px;font-size:12px}
#tools{position:fixed;right:calc(8px + var(--sr));bottom:calc(12px + var(--sb));display:flex;flex-direction:column;gap:7px}
#tools button{width:44px;height:44px;border-radius:50%;padding:0;font-size:19px;background:var(--panel);box-shadow:0 2px 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
#tools .sep{height:4px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--sb));display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none;width:min(440px,calc(100vw - 140px))}
.toast{background:var(--panel2);padding:6px 12px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 3px 12px rgba(0,0,0,.4);animation:tin .2s ease-out;text-align:center}
.toast.good{border-left:4px solid var(--good)} .toast.bad{border-left:4px solid var(--bad)} .toast.info{border-left:4px solid var(--blue)}
.toast b{color:var(--accent)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.22);display:none;pointer-events:none}
#joy i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.4)}
#modalWrap{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:calc(10px + var(--st)) calc(10px + var(--sr)) calc(10px + var(--sb)) calc(10px + var(--sl));z-index:10}
#modal{touch-action:pan-y;overscroll-behavior:contain;background:#202633;border-radius:16px;max-width:760px;width:100%;max-height:100%;overflow:auto;padding:16px 18px;box-shadow:0 10px 40px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text}
#modal.full{max-width:1100px;height:100%;display:flex;flex-direction:column;padding:10px 12px}
#modal h2{margin:0 0 8px;font-size:21px;text-wrap:balance} #modal h3{margin:14px 0 6px;font-size:16px;color:var(--accent)}
#modal p{margin:6px 0;line-height:1.45;color:#d9dee7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.card{background:#2a3242;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card .em{font-size:32px}
.card .en{font-weight:800;color:var(--accent);font-size:16px}
.muted{color:var(--muted);font-size:13px}
.opts{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.opts button{font-size:18px;padding:12px 18px;flex:1;min-width:110px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.word{background:#2a3242;border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.word b{color:var(--accent)}
.lock{opacity:.35}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.seg label{background:#2a3242;padding:8px 12px;border-radius:9px;cursor:pointer;flex:1;min-width:0}
.seg input{margin-right:6px}
details{background:#2a3242;border-radius:10px;padding:8px 12px;margin:8px 0}
summary{cursor:pointer;font-weight:800;color:var(--accent)}
.startRow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin:10px 0}
.startRow .primary{font-size:18px;padding:12px 22px}
.maphead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.maphead h2{margin:0!important;flex:1;font-size:18px!important}
#mapbox{position:relative;flex:1;min-height:200px;border-radius:10px;overflow:hidden;background:#111}
#bigmap{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#mapctl{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
#mapctl button{width:42px;height:42px;border-radius:50%;padding:0;font-size:18px;background:rgba(20,24,32,.85)}
#maphint{position:absolute;left:8px;top:8px;right:60px;width:max-content;max-width:calc(100% - 70px);font-size:12px;background:rgba(20,24,32,.8);padding:4px 8px;border-radius:8px;color:#cfd6e2;pointer-events:none}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 12px;font-size:13px;margin-top:6px}
.legend div{display:flex;gap:6px;align-items:baseline;cursor:pointer}
.num{display:inline-block;min-width:20px;height:20px;border-radius:50%;background:#e63946;color:#fff;text-align:center;font-weight:800;font-size:12px;line-height:20px}
kbd{background:#394254;border-radius:4px;padding:1px 6px;font-size:12px}
@media (max-width:700px){
  #mini{width:104px;height:80px}
  #stats{font-size:12px;gap:7px;padding:4px 8px}
  #order{left:calc(8px + var(--sl));right:calc(8px + var(--sr));transform:none;width:auto;min-width:0;top:calc(94px + var(--st));font-size:12px}
  #order .big{font-size:14px}
  #toasts{width:calc(100vw - 80px);left:calc(8px + var(--sl));transform:none;align-items:flex-start}
  .toast{font-size:12px;padding:5px 9px;text-align:left}
  #tools button{width:40px;height:40px;font-size:17px}
  #modal{padding:12px}
  #modal h2{font-size:18px}
  .startRow .primary{flex:1}
}
@media (prefers-reduced-motion:reduce){ .toast{animation:none} }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="stats" class="panel"></div>
<canvas id="mini" title="Карта (M)"></canvas>
<div id="order" class="panel" title="Нажми, чтобы свернуть/развернуть"></div>
<div id="toasts"></div>
<div id="tools">
  <button id="bZoomIn" title="Приблизить (+)" aria-label="Приблизить">＋</button>
  <button id="bZoomOut" title="Отдалить (−)" aria-label="Отдалить">－</button>
  <div class="sep"></div>
  <button id="bMap" title="Карта (M)" aria-label="Карта">🗺</button>
  <button id="bShop" title="Экипировка (B)" aria-label="Экипировка">🛒</button>
  <button id="bDict" title="Словарь (N)" aria-label="Словарь">📖</button>
  <button id="bMenu" title="Меню (Esc)" aria-label="Меню">☰</button>
</div>
<div id="joy"><i></i></div>
<div id="modalWrap"><div id="modal"></div></div>

const grid = new Uint8Array(W*H);
const getT = (x,y) => (x<0||y<0||x>=W||y>=H) ? TREE : grid[y*W+x];
const setT = (x,y,v) => { if (x>=0&&y>=0&&x<W&&y<H) grid[y*W+x]=v; };
const fillT = (x,y,w,h,v) => { for (let j=y;j<y+h;j++) for (let i=x;i<x+w;i++) setT(i,j,v); };

function dSeg(px,py,ax,ay,bx,by){ const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy; let t=l?((px-ax)*dx+(py-ay)*dy)/l:0; t=t<0?0:t>1?1:t; const x=ax+t*dx-px,y=ay+t*dy-py; return Math.sqrt(x*x+y*y); }

(function genCity(){
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    if (x<3||y<2||x>148||y>133){ grid[y*W+x]=TREE; continue; }
    let dr=1e9; for (const s of RSEGS){ const d=dSeg(x,y,s.a[0],s.a[1],s.b[0],s.b[1]); if (d<dr) dr=d; }
    let dc=1e9; for (const s of CSEGS){ const d=dSeg(x,y,s.a[0],s.a[1],s.b[0],s.b[1]); if (d<dc) dc=d; }
    grid[y*W+x] = dr<1.5 ? ROAD : dr<2.5 ? SIDE : dc<1.1 ? WATER : dc<2.2 ? PARK : G;
  }
  // участки достопримечательностей 9×9
  LANDMARKS.forEach(lm => {
    const b = {x0:lm.c[0]-4, y0:lm.c[1]-4, lm}; b.X=b.x0*T; b.Y=b.y0*T; lm.block=b; lots.push(b);
    for (let j=0;j<9;j++) for (let i=0;i<9;i++){ const t=getT(b.x0+i,b.y0+j); if (t===ROAD) console.warn('road inside lot',lm.key);
      setT(b.x0+i,b.y0+j,(i===0||j===0||i===8||j===8)?SIDE:PLAZA); }
    buildLandmark(b,lm);
  });
  // плотная застройка: дома, дворы, скверы
  for (let y=2;y<H-2;y++) for (let x=3;x<W-3;x++){
    if (grid[y*W+x]!==G) continue;
    let w=2+Math.floor(rnd()*4), h=2+Math.floor(rnd()*4);
    while (w>1){ let ok=true; for (let i=0;i<w;i++) if (getT(x+i,y)!==G){ ok=false; break; } if (ok) break; w--; }
    while (h>1){ let ok=true; for (let j=0;j<h&&ok;j++) for (let i=0;i<w;i++) if (getT(x+i,y+j)!==G){ ok=false; break; } if (ok) break; h--; }
    if (w<2||h<2){ setT(x,y,PLAZA); if (rnd()<.18) decor.push({x:tp(x)+(rnd()-.5)*10,y:tp(y)+(rnd()-.5)*10,r:9+rnd()*4}); continue; }
    if (rnd()<.07){ fillT(x,y,w,h,PARK); }
    else { fillT(x,y,w,h,BLD); makeBuilding(x,y,w,h); }
    if (rnd()<.4) for (let j=0;j<h;j++) if (getT(x+w,y+j)===G) setT(x+w,y+j,PLAZA);
    if (rnd()<.4) for (let i=0;i<w;i++) if (getT(x+i,y+h)===G) setT(x+i,y+h,PLAZA);
  }
  for (let y=0;y<H;y++) for (let x=0;x<W;x++) if (grid[y*W+x]===PARK && rnd()<.33 && !lots.some(b=>x>=b.x0&&x<b.x0+9&&y>=b.y0&&y<b.y0+9))
    decor.push({x:tp(x)+(rnd()-.5)*14,y:tp(y)+(rnd()-.5)*14,r:10+rnd()*5});
})();

// ---------- Граф дорог (для машин, пешеходов и маршрутов) ----------
const NODES = [], nodeIdx = new Map(), EDGES = [];
function nodeAt(x,y){ const k=Math.round(x*2)+'|'+Math.round(y*2); if (nodeIdx.has(k)) return nodeIdx.get(k);
  const id=NODES.length; NODES.push({id,x:tp(x),y:tp(y),out:[]}); nodeIdx.set(k,id); return id; }
(function buildGraph(){
  const splits = RSEGS.map(()=>[0,1]);
  for (let i=0;i<RSEGS.length;i++) for (let j=i+1;j<RSEGS.length;j++){
    const A=RSEGS[i].a,B=RSEGS[i].b,Cc=RSEGS[j].a,D=RSEGS[j].b;
    const rx_=B[0]-A[0], ry_=B[1]-A[1], sx=D[0]-Cc[0], sy=D[1]-Cc[1], den=rx_*sy-ry_*sx;
    if (Math.abs(den)<1e-9) continue;
    const t=((Cc[0]-A[0])*sy-(Cc[1]-A[1])*sx)/den, u=((Cc[0]-A[0])*ry_-(Cc[1]-A[1])*rx_)/den;
    if (t<-1e-6||t>1+1e-6||u<-1e-6||u>1+1e-6) continue;
    splits[i].push(clamp(t,0,1)); splits[j].push(clamp(u,0,1));
  }
  const seen = new Set();
  RSEGS.forEach((s,i) => {
    const ts=[...new Set(splits[i].map(v=>Math.round(v*1e5)/1e5))].sort((a,b)=>a-b);
    const ids = ts.map(t=>nodeAt(s.a[0]+(s.b[0]-s.a[0])*t, s.a[1]+(s.b[1]-s.a[1])*t));
    for (let k=0;k<ids.length-1;k++){ const a=ids[k], b=ids[k+1]; if (a===b) continue; const key=Math.min(a,b)+'-'+Math.max(a,b); if (seen.has(key)) continue; seen.add(key);
      const A=NODES[a], B=NODES[b], len=Math.hypot(B.x-A.x,B.y-A.y), ux=(B.x-A.x)/len, uy=(B.y-A.y)/len;
      const e1={a,b,len,ux,uy,ang:Math.atan2(uy,ux),key:a+'>'+b,ri:s.ri}, e2={a:b,b:a,len,ux:-ux,uy:-uy,ang:Math.atan2(-uy,-ux),key:b+'>'+a,ri:s.ri};
      A.out.push(e1); B.out.push(e2); EDGES.push(e1); }
  });
})();
// ближайшая точка на дороге
function nearestOnRoad(x,y){
  let best=null, bd=1e18;
  for (const e of EDGES){ const A=NODES[e.a]; let t=((x-A.x)*e.ux+(y-A.y)*e.uy); t=clamp(t,0,e.len); const px=A.x+e.ux*t, py=A.y+e.uy*t, d=(px-x)**2+(py-y)**2;
    if (d<bd){ bd=d; best={e,t,px,py}; } }
  return best;
}
// кратчайший маршрут по дорогам (Дейкстра)
function route(x0,y0,x1,y1){
  const s=nearestOnRoad(x0,y0), g=nearestOnRoad(x1,y1);
  const n=NODES.length, dist=new Float64Array(n).fill(Infinity), prev=new Int32Array(n).fill(-1), done=new Uint8Array(n);
  dist[s.e.a]=s.t; dist[s.e.b]=s.e.len-s.t;
  for (;;){ let u=-1, m=Infinity; for (let i=0;i<n;i++) if (!done[i]&&dist[i]<m){ m=dist[i]; u=i; } if (u<0) break; done[u]=1;
    for (const e of NODES[u].out){ const nd=m+e.len; if (nd<dist[e.b]){ dist[e.b]=nd; prev[e.b]=u; } } }
  const ca=dist[g.e.a]+g.t, cb=dist[g.e.b]+(g.e.len-g.t);
  let end = ca<=cb ? g.e.a : g.e.b, len=Math.min(ca,cb);
  if (s.e.a===g.e.a&&s.e.b===g.e.b || s.e.a===g.e.b&&s.e.b===g.e.a){ const direct=Math.hypot(s.px-g.px,s.py-g.py); if (direct<=len){ return {pts:[[x0,y0],[s.px,s.py],[g.px,g.py],[x1,y1]], len:direct+Math.hypot(x0-s.px,y0-s.py)}; } }
  const path=[]; for (let v=end; v>=0; v=prev[v]) path.push(v); path.reverse();
  const pts=[[x0,y0],[s.px,s.py]]; path.forEach(v=>pts.push([NODES[v].x,NODES[v].y])); pts.push([g.px,g.py],[x1,y1]);
  return {pts, len:len+Math.hypot(x0-s.px,y0-s.py)+Math.hypot(x1-g.px,y1-g.py)};
}

const SIGNS = [];
function signFor(bl, side){
  const ok = (x,y) => getT(x,y)===SIDE;
  if (side==='N'||side==='S'){
    if (bl.tw<3||bl.th<2) return null;
    const sx=bl.tx+Math.floor((bl.tw-3)/2), zy= side==='N'? bl.ty-1 : bl.ty+bl.th;
    for (let i=0;i<3;i++) if (!ok(sx+i,zy)) return null;
    return {zone:{x:sx*T,y:zy*T,w:3*T,h:T},
      board:{x:sx*T+4,y:side==='N'?bl.Y+4:bl.Y+bl.h-38,w:3*T-8,h:34},
      awn: side==='N'?{x:sx*T+6,y:bl.Y-6,w:3*T-12,h:10,v:0}:{x:sx*T+6,y:bl.Y+bl.h-4,w:3*T-12,h:10,v:0}};
  }
  if (bl.tw<3||bl.th<3) return null;
  const sy=bl.ty+Math.floor((bl.th-3)/2), zx= side==='W'? bl.tx-1 : bl.tx+bl.tw;
  for (let i=0;i<3;i++) if (!ok(zx,sy+i)) return null;
  return {zone:{x:zx*T,y:sy*T,w:T,h:3*T},
    board:{x:side==='W'?bl.X+4:bl.X+bl.w-3*T+4,y:sy*T+31,w:3*T-8,h:34},
    awn: side==='W'?{x:bl.X-6,y:sy*T+6,w:10,h:3*T-12,v:1}:{x:bl.X+bl.w-4,y:sy*T+6,w:10,h:3*T-12,v:1}};
}
(function placeSigns(){
  const cands=[];
  buildings.forEach(bl => ['N','S','W','E'].forEach(sd => { const g=signFor(bl,sd); if (g) cands.push(Object.assign({bl,side:sd},g)); }));
  for (let i=cands.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [cands[i],cands[j]]=[cands[j],cands[i]]; }
  const list = SHOPS.map(s=>({kind:'shop',ref:s})).concat(PUBLIC.map(p=>({kind:'public',ref:p})));
  // равномерно по городу: делим карту на зоны и берём по одному кандидату на зону
  const picked=[], used=new Set();
  for (let minD=26; picked.length<list.length && minD>=6; minD-=4)
    for (const c of cands){ if (picked.length>=list.length) break; if (used.has(c.bl)) continue;
      const cx=c.zone.x+c.zone.w/2, cy=c.zone.y+c.zone.h/2;
      if (picked.every(p=>Math.hypot(p.cx-cx,p.cy-cy)>minD*T)){ c.cx=cx; c.cy=cy; picked.push(c); used.add(c.bl); } }
  for (let i=picked.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [picked[i],picked[j]]=[picked[j],picked[i]]; }
  list.forEach((it,i) => { const c=picked[i]; if (!c) return; SIGNS.push({id:it.ref.id,kind:it.kind,ref:it.ref,zone:c.zone,board:c.board,awn:c.awn,cx:c.cx,cy:c.cy}); });
})();

}

// ---------- Игрок, машины, пешеходы ----------
const startDest = LANDMARKS.find(l=>l.key==='amir');
const P = {x:0, y:0, vx:0, vy:0, ang:-Math.PI/2, stun:0, walk:0, hitCd:0};
{ const b=startDest.block; P.x=(b.x0+4.5)*T; P.y=(b.y0+8.5)*T; }
const vehSpeed = () => S.vehicle==='foot' ? FOOT_SPEED : (GEAR.find(g=>g.id===S.vehicle)||{speed:FOOT_SPEED}).speed;
const has = id => S.owned.includes(id);
const LANE = 24;
const CAR_COLORS = ['#f5f5f5','#f5f5f5','#ececec','#c0c4c8','#9aa0a6','#1f1f1f','#2c3e50','#7b1e1e','#e1e1e1','#ffffff','#3c6382','#b8b8b8'];
const cars = [];
function laneXY(e,s,off){ const A=NODES[e.a]; return [A.x+e.ux*s-e.uy*off, A.y+e.uy*s+e.ux*off]; }
for (let i=0;i<80;i++){
  const bus=i%10===0, e=pick(EDGES.filter(e=>e.len>4*T)), s=Math.random()*e.len;
  const c={e,s,len:bus?72:40,wid:bus?24:20,color:bus?pick(['#2e86de','#10ac84','#ee5253']):pick(CAR_COLORS),bus,taxi:!bus&&Math.random()<.2,max:bus?90:100+Math.random()*60,spd:60,hcd:0};
  [c.x,c.y]=laneXY(e,s,LANE); c.ang=e.ang; cars.push(c);
}
function nextEdge(e){ const nd=NODES[e.b]; let o=nd.out.filter(x=>x.b!==e.a); if (!o.length) o=nd.out;
  const straight=o.find(x=>Math.abs(((x.ang-e.ang+3*Math.PI)%(2*Math.PI))-Math.PI)<.3);
  return (straight && Math.random()<.55) ? straight : pick(o); }
function updateCars(dt){
  const byEdge=new Map(); for (const c of cars){ const k=c.e.key; if(!byEdge.has(k)) byEdge.set(k,[]); byEdge.get(k).push(c); }
  for (const c of cars){
    let target=c.max;
    for (const o of byEdge.get(c.e.key)){ if (o===c) continue; const d=o.s-c.s; if (d>0 && d<c.len/2+o.len/2+16){ target=0; break; } }
    // машины на следующем перекрёстке
    if (target>0 && c.e.len-c.s < 40) for (const ne of NODES[c.e.b].out){ const l=byEdge.get(ne.key); if (l && l.some(o=>o.s<o.len/2+8)){ target=Math.min(target,20); break; } }
    const ca=Math.cos(c.ang), sa=Math.sin(c.ang);
    const lx=(P.x-c.x)*ca+(P.y-c.y)*sa, ly=-(P.x-c.x)*sa+(P.y-c.y)*ca;
    if (lx>0 && lx<c.len/2+55 && Math.abs(ly)<c.wid/2+14){ target=Math.min(target, lx<c.len/2+22?0:30);
      c.hcd-=dt; if (c.hcd<=0 && Math.hypot(P.x-c.x,P.y-c.y)<300){ sfx.honk(); c.hcd=2.5; } }
    c.spd += clamp(target-c.spd,-400*dt,120*dt);
    c.s += c.spd*dt;
    while (c.s>c.e.len){ c.s-=c.e.len; c.e=nextEdge(c.e); }
    const [tx,ty]=laneXY(c.e,c.s,LANE), k=Math.min(1,dt*9);
    c.x+=(tx-c.x)*k; c.y+=(ty-c.y)*k;
    let da=c.e.ang-c.ang; while(da>Math.PI) da-=2*Math.PI; while(da<-Math.PI) da+=2*Math.PI; c.ang+=clamp(da,-5*dt,5*dt);
    const ca2=Math.cos(c.ang), sa2=Math.sin(c.ang), lx2=(P.x-c.x)*ca2+(P.y-c.y)*sa2, ly2=-(P.x-c.x)*sa2+(P.y-c.y)*ca2;
    if (Math.abs(lx2)<c.len/2+9 && Math.abs(ly2)<c.wid/2+9) hitByCar(c,lx2,ly2,ca2,sa2);
  }
}
function hitByCar(c,lx,ly,ca,sa){
  const ox=c.len/2+10-Math.abs(lx), oy=c.wid/2+10-Math.abs(ly);
  let nx,ny; if (ox<oy){ const s=Math.sign(lx)||1; nx=ca*s; ny=sa*s; } else { const s=Math.sign(ly)||1; nx=-sa*s; ny=ca*s; }
  const push=Math.min(ox,oy)+1;
  if (canStand(P.x+nx*push,P.y+ny*push)){ P.x+=nx*push; P.y+=ny*push; }
  if (P.hitCd<=0){
    P.hitCd=2; P.stun=.8; P.vx=nx*180; P.vy=ny*180; sfx.bad();
    const fine=Math.min(S.money,2000); S.money-=fine; save();
    toast(`💥 <b>Be careful!</b> — Осторожно! ${fine?'Штраф '+fmt(fine):''}`,'bad'); say('Be careful!');
  }
}
const peds=[];
for (let i=0;i<110;i++){ const e=pick(EDGES); peds.push({e,s:Math.random()*e.len,v:22+Math.random()*22,side:Math.random()<.5?1:-1,c:pick(['#e74c3c','#3498db','#9b59b6','#f1c40f','#1abc9c','#e67e22','#ecf0f1','#2c3e50','#ff7fbf'])}); }
function updatePeds(dt){ for (const p of peds){ p.s+=p.v*dt; if (p.s>p.e.len){ p.s-=p.e.len; const o=NODES[p.e.b].out; p.e=pick(o); } } }

// ---------- Движение игрока ----------
function canStand(x,y,r=9){
  for (const [dx,dy] of [[-r,-r],[r,-r],[-r,r],[r,r],[0,-r],[0,r],[-r,0],[r,0]])
    if (isSolid(getT(Math.floor((x+dx)/T),Math.floor((y+dy)/T)))) return false;
  return true;
}
const keys={};
const joy={active:false,id:null,ox:0,oy:0,dx:0,dy:0};
function updatePlayer(dt){
  let ix=0, iy=0;
  if (keys.ArrowLeft||keys.KeyA) ix-=1; if (keys.ArrowRight||keys.KeyD) ix+=1;
  if (keys.ArrowUp||keys.KeyW) iy-=1; if (keys.ArrowDown||keys.KeyS) iy+=1;
  if (joy.active){ ix=joy.dx; iy=joy.dy; }
  const m=Math.hypot(ix,iy); if (m>1){ ix/=m; iy/=m; }
  P.hitCd-=dt;
  const sp=vehSpeed(), acc=S.vehicle==='foot'?14:S.vehicle==='moto'?3.5:5;
  if (P.stun>0){ P.stun-=dt; ix=iy=0; }
  P.vx+=(ix*sp-P.vx)*Math.min(1,acc*dt); P.vy+=(iy*sp-P.vy)*Math.min(1,acc*dt);
  const nx=P.x+P.vx*dt, ny=P.y+P.vy*dt;
  if (canStand(nx,P.y)) P.x=nx; else P.vx*=.2;
  if (canStand(P.x,ny)) P.y=ny; else P.vy*=.2;
  const v=Math.hypot(P.vx,P.vy);
  if (v>15){ const ta=Math.atan2(P.vy,P.vx); let da=ta-P.ang; while(da>Math.PI)da-=2*Math.PI; while(da<-Math.PI)da+=2*Math.PI; P.ang+=da*Math.min(1,12*dt); P.walk+=v*dt*.08; }
}

let order=null, nextOrderIn=0, lastSign=null, lastDest=null, gps=null, gpsT=0;
function newOrder(){
  const pool=[];

  let best=null;
  for (let k=0;k<30;k++){ const d=pick(DESTS); if (d.sign===s) continue; const r2=route(s.cx,s.cy,d.cx,d.cy);

function inZone(z,m=6){ return P.x>z.x-m && P.x<z.x+z.w+m && P.y>z.y-m && P.y<z.y+z.h+m; }
function checkZones(){

// ---------- Отрисовка мира ----------
const cv=$('game'), ctx=cv.getContext('2d');
let dpr=1, VW=0, VH=0, zoom=1, camX=0, camY=0, perfT=0, zoomUser=clamp(S.zoom||1,.4,2.2);
function resize(){ dpr=Math.min(2,window.devicePixelRatio||1); VW=innerWidth; VH=innerHeight; cv.width=Math.round(VW*dpr); cv.height=Math.round(VH*dpr);
  zoom=clamp(Math.min(VW,VH)/720,.7,1.3)*zoomUser; }

addEventListener('resize',resize);
const R=(x,y,w,h,c)=>{ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); };
const C=(x,y,r,c)=>{ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); };
function RR(x,y,w,h,r,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h); ctx.fill(); }
function tree(x,y,r=12,c='#2f7d32'){ C(x+4,y+5,r,'rgba(0,0,0,.22)'); C(x,y,r,c); C(x-r*.3,y-r*.3,r*.5,'rgba(255,255,255,.13)'); }

const inView=(x,y,w,h)=>x+w>camX-40&&y+h>camY-40&&x<camX+VW/zoom+40&&y<camY+VH/zoom+40;

function drawBuilding(bl){
  R(bl.X+bl.hgt,bl.Y+bl.hgt,bl.w,bl.h,'rgba(0,0,0,.28)');
  R(bl.X,bl.Y,bl.w,bl.h,shade(bl.roof,-28));

  ctx.strokeStyle='rgba(0,0,0,.08)'; ctx.lineWidth=1; ctx.strokeRect(bl.X+8.5,bl.Y+8.5,bl.w-17,bl.h-17);
  for (const d of bl.det){
    if (d.t==='ac'){ R(bl.X+d.x+2,bl.Y+d.y+2,d.s,d.s*.8,'rgba(0,0,0,.2)'); R(bl.X+d.x,bl.Y+d.y,d.s,d.s*.8,'#b7bcc2'); C(bl.X+d.x+d.s/2,bl.Y+d.y+d.s*.4,d.s*.25,'#80868c'); }

function shade(hex,amt){ const n=parseInt(hex.slice(1),16); const r=clamp((n>>16)+amt,0,255), g=clamp((n>>8&255)+amt,0,255), b=clamp((n&255)+amt,0,255); return `rgb(${r},${g},${b})`; }

function polyPath(pts){ ctx.beginPath(); pts.forEach(([x,y],i)=>i?ctx.lineTo(tp(x),tp(y)):ctx.moveTo(tp(x),tp(y))); }
function drawGround(){
  const vw=VW/zoom, vh=VH/zoom;
  const tx0=Math.max(0,Math.floor(camX/T)), ty0=Math.max(0,Math.floor(camY/T)), tx1=Math.min(W-1,Math.ceil((camX+vw)/T)), ty1=Math.min(H-1,Math.ceil((camY+vh)/T));
  for (let y=ty0;y<=ty1;y++) for (let x=tx0;x<=tx1;x++){ const t=grid[y*W+x];
    if (t===PARK) R(x*T,y*T,T+.5,T+.5,'#62a64d'); else if (t===TREE){ R(x*T,y*T,T+.5,T+.5,'#4f8f3f'); } }
  for (let y=ty0;y<=ty1;y++) for (let x=tx0;x<=tx1;x++) if (grid[y*W+x]===TREE) tree(x*T+16,y*T+16,15,'#2e6b2a');

  ctx.lineCap='round'; ctx.lineJoin='round';
  polyPath(CANAL); ctx.strokeStyle='#8f8a7e'; ctx.lineWidth=2.6*T; ctx.stroke();
  polyPath(CANAL); ctx.strokeStyle='#3d8fd1'; ctx.lineWidth=2.2*T; ctx.stroke();

  else { fitText(ref.icon+' '+ref.en,bd.x+bd.w/2,bd.y+bd.h/2,bd.w-8,11,'#fff'); }
}
function drawCar(c){
  ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.ang); const L=c.len, Wd=c.wid;
  R(-L/2+4,-Wd/2+4,L,Wd,'rgba(0,0,0,.3)'); RR(-L/2,-Wd/2,L,Wd,5,c.color);
  if (c.bus){ R(-L/2+6,-Wd/2+3,L-14,Wd-6,shade(c.color,25)); for(let i=0;i<5;i++) R(-L/2+10+i*11,-Wd/2+1,7,2,'#223'); R(L/2-8,-Wd/2+3,5,Wd-6,'#1c2833'); }
  else { R(L/2-15,-Wd/2+2,7,Wd-4,'#1c2833'); R(-L/2+5,-Wd/2+3,6,Wd-6,'#1c2833'); R(-L/2+11,-Wd/2+3,L/2-2,Wd-6,shade(c.color.length===7?c.color:'#cccccc',-15));
    if (c.taxi){ R(-4,-5,8,10,'#f7d31a'); } }
  R(L/2-3,-Wd/2+2,3,4,'#fff6a8'); R(L/2-3,Wd/2-6,3,4,'#fff6a8'); R(-L/2,-Wd/2+2,2,4,'#e53935'); R(-L/2,Wd/2-6,2,4,'#e53935');
  ctx.restore();
}
function drawPlayer(){
  ctx.save(); ctx.translate(P.x,P.y); ctx.rotate(P.ang);
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(3,4,S.vehicle==='foot'?11:19,10,0,0,7); ctx.fill();
  const v=S.vehicle;
  if (v==='bicycle'){ R(-17,-2,9,4,'#111'); R(9,-2,9,4,'#111'); R(-10,-1.5,22,3,'#16a085'); R(11,-8,3,16,'#333'); }
  else if (v==='kick'){ RR(-15,-4,26,8,3,'#2d3436'); R(-17,-2,5,4,'#111'); R(11,-2,6,4,'#111'); R(12,-9,3,18,'#636e72'); }
  else if (v==='moto'){ ctx.fillStyle='#e63946'; ctx.beginPath(); ctx.ellipse(0,0,20,9,0,0,7); ctx.fill(); RR(-10,-5,13,10,4,'#222'); R(14,-10,3,20,'#444'); C(19,0,3,'#fff6a8'); }
  else { const s=Math.sin(P.walk)*5; ctx.fillStyle='#2d3436'; ctx.beginPath(); ctx.ellipse(s,-4,5,2.5,0,0,7); ctx.ellipse(-s,4,5,2.5,0,0,7); ctx.fill(); }
  // термокороб за спиной
  RR(-15,-9,10,18,2,'#f4c430'); R(-15,-1,10,2,'#b38b00');
  // тело и голова
  ctx.fillStyle = has('jacket') ? '#ff7f11' : '#3b82f6'; ctx.beginPath(); ctx.ellipse(-1,0,7,10,0,0,7); ctx.fill();
  if (has('jacket')){ R(-3,-10,2,20,'#ffd8a8'); }
  C(1,0,6,'#3b2414'); C(3,0,3.5,'#e0ac69');
  if (has('cap')){ C(0,0,6.5,'#1d4ed8'); RR(3,-5,6,10,3,'#1e40af'); C(0,0,1.5,'#fff'); }
  ctx.restore();
  if (P.stun>0){ for (let i=0;i<3;i++){ const a=perfT*6+i*2.1; txt('⭐',P.x+Math.cos(a)*14,P.y-18+Math.sin(a)*4,10,'#fff'); } }
  if (order && order.phase==='deliver'){ ctx.font='16px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(order.item.e,P.x,P.y-24); }
}

function drawGps(){
  if (!gps) return;
  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=12; ctx.beginPath(); gps.pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.stroke();
  ctx.strokeStyle='rgba(255,200,61,.85)'; ctx.lineWidth=7; ctx.setLineDash([16,10]); ctx.lineDashOffset=-perfT*40; ctx.stroke(); ctx.setLineDash([]); ctx.lineCap='butt';
}
function drawTargets(){
  const t=targetPoint(); if (!t) return;
  const z=order.phase==='deliver'?order.dest.zone:order.sign.zone, pulse=Math.sin(perfT*5)*.5+.5;
  ctx.strokeStyle=`rgba(255,200,61,${.5+pulse*.5})`; ctx.lineWidth=3; ctx.setLineDash([8,6]); ctx.strokeRect(z.x-3,z.y-3,z.w+6,z.h+6); ctx.setLineDash([]);
  ctx.fillStyle=`rgba(255,200,61,${.15+pulse*.15})`; ctx.fillRect(z.x,z.y,z.w,z.h);
  const by=t.y-34-pulse*8; ctx.fillStyle='#ffc83d'; ctx.beginPath(); ctx.moveTo(t.x-10,by); ctx.lineTo(t.x+10,by); ctx.lineTo(t.x,by+14); ctx.fill(); ctx.strokeStyle='#000'; ctx.lineWidth=1.5; ctx.stroke();
}
let uiTop=60;
function drawEdgeArrow(){
  const t=targetPoint(); if (!t) return;
  const sx=(t.x-camX)*zoom, sy=(t.y-camY)*zoom, mx=30, top=uiTop+20, bot=VH-30, right=VW-70;
  if (sx>mx&&sy>top&&sx<right&&sy<bot) return;
  const px=(P.x-camX)*zoom, py=(P.y-camY)*zoom, a=Math.atan2(sy-py,sx-px), ca=Math.cos(a), sa=Math.sin(a);
  const k=Math.min(ca>0?(right-px)/ca:ca<0?(mx-px)/ca:1e9, sa>0?(bot-py)/sa:sa<0?(top-py)/sa:1e9);
  const ax=px+ca*k, ay=py+sa*k, dist=Math.round((gps?gps.len:Math.hypot(t.x-P.x,t.y-P.y))/T*5);
  ctx.save(); ctx.translate(ax,ay); ctx.rotate(a); ctx.fillStyle='#ffc83d'; ctx.strokeStyle='#000'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(16,0); ctx.lineTo(-9,-12); ctx.lineTo(-4,0); ctx.lineTo(-9,12); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  const lx=ax-ca*30, ly=ay-sa*30; ctx.font='800 12px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(0,0,0,.7)'; ctx.fillRect(lx-26,ly-9,52,18); ctx.fillStyle='#fff'; ctx.fillText(dist>=1000?(dist/1000).toFixed(1)+' km':dist+' m',lx,ly);
}
function render(){
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#d9d1c0'; ctx.fillRect(0,0,cv.width,cv.height);
  const vw=VW/zoom, vh=VH/zoom;
  camX=clamp(P.x-vw/2,0,Math.max(0,WPX-vw)); camY=clamp(P.y-vh/2,0,Math.max(0,HPX-vh));
  if (vw>WPX) camX=(WPX-vw)/2; if (vh>HPX) camY=(HPX-vh)/2;
  ctx.setTransform(dpr*zoom,0,0,dpr*zoom,-camX*dpr*zoom,-camY*dpr*zoom);
  drawGround();
  for (const b of lots) if (inView(b.X,b.Y,9*T,9*T)){ drawLot(b); drawLandmark(b); }
  const cx0=Math.max(0,Math.floor(camX/T/CH)-1), cy0=Math.max(0,Math.floor(camY/T/CH)-1), cx1=Math.min(CW_-1,Math.floor((camX+vw)/T/CH)), cy1=Math.min(CH_-1,Math.floor((camY+vh)/T/CH));
  for (let cy=cy0;cy<=cy1;cy++) for (let cx=cx0;cx<=cx1;cx++){ const ch=chunks[cy*CW_+cx];
    for (const bl of ch.b) if (inView(bl.X,bl.Y,bl.w,bl.h)) drawBuilding(bl); }
  for (let cy=cy0;cy<=cy1;cy++) for (let cx=cx0;cx<=cx1;cx++) for (const d of chunks[cy*CW_+cx].t) if (inView(d.x-20,d.y-20,40,40)) tree(d.x,d.y,d.r);
  for (const s of SIGNS) if (inView(s.board.x-20,s.board.y-20,140,140)) drawSign(s);
  drawGps(); drawTargets();
  for (const p of peds){ const [x,y]=laneXY(p.e,p.s,2*T*p.side); if (!inView(x,y,1,1)) continue; C(x+2,y+2,5,'rgba(0,0,0,.2)'); C(x,y,5,p.c); C(x,y,3,'#4a3020'); }
  for (const c of cars) if (inView(c.x-40,c.y-40,80,80)) drawCar(c);
  drawPlayer();
  if (zoom>.55) for (const b of lots) if (inView(b.X,b.Y,9*T,9*T)) drawLandmarkLabel(b);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawEdgeArrow();
}

// ---------- Главный цикл ----------
let last=performance.now(), hudT=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; perfT+=dt;
  if (!paused){
    updatePlayer(dt); updateCars(dt); updatePeds(dt); checkZones(); updateGps(dt);
    if (order) order.time-=dt;
    if (!order&&nextOrderIn>0){ nextOrderIn-=dt; if (nextOrderIn<=0) newOrder(); }
  }
  render();
  hudT+=dt; if (hudT>.15){ hudT=0; updateTimer(); drawMini(); renderStats();
    const ob=$('order'); uiTop = ob.style.display==='block' ? ob.getBoundingClientRect().bottom : $('mini').getBoundingClientRect().bottom; }
  requestAnimationFrame(frame);
}

// ---------- Ввод ----------
addEventListener('keydown',e=>{
  if (modalOpen){ if (e.code==='Escape'&&!modalNoClose) closeModal();
    if (mapCv && (e.key==='+'||e.key==='=')) zoomMap(1.3); if (mapCv && e.key==='-') zoomMap(1/1.3); return; }
  keys[e.code]=true;
  if (e.code==='KeyM') openMap(); else if (e.code==='KeyB') openShop(); else if (e.code==='KeyN') openDict();
  else if (e.code==='KeyH'||e.code==='Escape') openMenu(); else if (e.code==='KeyF') useHint();
  else if (e.key==='+'||e.key==='=') setZoom(zoomUser*1.15); else if (e.key==='-') setZoom(zoomUser/1.15);
  if (e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup',e=>{ keys[e.code]=false; });
addEventListener('blur',()=>{ for (const k in keys) keys[k]=false; });
cv.addEventListener('wheel',e=>{ e.preventDefault(); setZoom(zoomUser*Math.exp(-e.deltaY*.0012)); },{passive:false});
const joyEl=$('joy'), touches=new Map(); let gPinch=null;
cv.addEventListener('pointerdown',e=>{
  if (e.pointerType==='mouse') return;
  touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (touches.size===2){ const [a,b]=[...touches.values()]; gPinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:zoomUser}; joy.active=false; joy.dx=joy.dy=0; joyEl.style.display='none'; return; }
  if (touches.size===1){ joy.active=true; joy.id=e.pointerId; joy.ox=e.clientX; joy.oy=e.clientY; joy.dx=joy.dy=0;
    joyEl.style.display='block'; joyEl.style.left=(e.clientX-60)+'px'; joyEl.style.top=(e.clientY-60)+'px'; joyEl.firstChild.style.transform=''; }
});
cv.addEventListener('pointermove',e=>{
  if (!touches.has(e.pointerId)) return; const t=touches.get(e.pointerId); t.x=e.clientX; t.y=e.clientY;
  if (gPinch&&touches.size>=2){ const [a,b]=[...touches.values()]; setZoom(gPinch.z*Math.hypot(a.x-b.x,a.y-b.y)/gPinch.d); return; }
  if (!joy.active||e.pointerId!==joy.id) return;
  let dx=e.clientX-joy.ox, dy=e.clientY-joy.oy; const m=Math.hypot(dx,dy), R0=50;
  if (m>R0){ dx*=R0/m; dy*=R0/m; } joy.dx=dx/R0; joy.dy=dy/R0; if (m<8) joy.dx=joy.dy=0;
  joyEl.firstChild.style.transform=`translate(${dx}px,${dy}px)`;
});
const tEnd=e=>{ touches.delete(e.pointerId); if (touches.size<2) gPinch=null; if (e.pointerId===joy.id){ joy.active=false; joy.dx=joy.dy=0; joyEl.style.display='none'; } };
cv.addEventListener('pointerup',tEnd); cv.addEventListener('pointercancel',tEnd);
$('mini').onclick=openMap; $('bMap').onclick=openMap; $('bShop').onclick=openShop; $('bDict').onclick=openDict; $('bMenu').onclick=openMenu;
$('bZoomIn').onclick=()=>setZoom(zoomUser*1.25); $('bZoomOut').onclick=()=>setZoom(zoomUser/1.25);
addEventListener('resize',()=>{ if (mapCv&&modalOpen) drawBigMap(); });

resize(); renderStats(); openStart(); requestAnimationFrame(frame);
window.__game={P,S,SIGNS,DESTS,get order(){return order;},newOrder,cars,NODES,EDGES,route,setZoom,get gps(){return gps;}};
</script>
